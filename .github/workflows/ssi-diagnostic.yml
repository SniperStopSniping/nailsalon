name: Exact 9793 SSI diagnostic
on:
  push:
    branches: [codex/hosted-ssi-diagnostic-20261021]
permissions:
  contents: read
concurrency:
  group: exact-9793-ssi-diagnostic
  cancel-in-progress: false
jobs:
  diagnostic:
    if: >-
      github.repository == 'SniperStopSniping/nailsalon' &&
      github.actor == 'SniperStopSniping' &&
      github.triggering_actor == 'SniperStopSniping' &&
      github.ref == 'refs/heads/codex/hosted-ssi-diagnostic-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout reviewed diagnostic harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
      - name: Checkout immutable application
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 9793ab2220b813cef47505329c5e27c3ea2d040d
          path: application
          persist-credentials: false
      - name: Use official Node24 runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Check offline controller contracts
        run: python3 -B harness/scripts/ssi-diagnostic/contract.py
      - name: Execute one secret-free guarded diagnostic
        run: python3 -B harness/scripts/ssi-diagnostic/run.py --execute
      - name: Upload explicit sanitized evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exact-9793-ssi-safe-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ssi-diagnostic-safe/*/run-context.json
            ${{ runner.temp }}/ssi-diagnostic-safe/*/result.json
          if-no-files-found: ignore
          retention-days: 7
