name: Checkly

on: [deployment_status]

jobs:
  test-e2e:
    # This workflow holds Checkly credentials. Run it only for the public
    # Production deployment; Preview coverage remains in the normal CI suite.
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Production'
    name: Test E2E on Checkly
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      # Always execute trusted repository code. The deployment SHA is checked
      # separately before dependencies or credentials are introduced.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Production deployment identity
        env:
          CHECKLY_DEPLOYMENT_STATE: ${{ github.event.deployment_status.state }}
          CHECKLY_DEPLOYMENT_ENVIRONMENT: ${{ github.event.deployment_status.environment }}
          CHECKLY_DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
        run: node scripts/verify-checkly-deployment.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install dependencies
        run: npm ci

      # The privileged Checkly project targets the fixed public Production
      # origin. No deployment-provided URL or bypass token reaches this step.
      - name: Run checks
        id: run-checks
        run: npx checkly test --reporter=github --record
        env:
          CHECKLY_API_KEY: ${{ secrets.CHECKLY_API_KEY }}
          CHECKLY_ACCOUNT_ID: ${{ secrets.CHECKLY_ACCOUNT_ID }}
          CHECKLY_TEST_ENVIRONMENT: Production
          ENVIRONMENT_URL: https://www.lustergel.app

      - name: Create summary
        run: cat checkly-github-report.md > "$GITHUB_STEP_SUMMARY"

      - name: Deploy checks
        if: steps.run-checks.outcome == 'success'
        run: npx checkly deploy --force
        env:
          CHECKLY_API_KEY: ${{ secrets.CHECKLY_API_KEY }}
          CHECKLY_ACCOUNT_ID: ${{ secrets.CHECKLY_ACCOUNT_ID }}
          CHECKLY_TEST_ENVIRONMENT: Production
          ENVIRONMENT_URL: https://www.lustergel.app
