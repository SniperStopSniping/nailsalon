name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret hygiene
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Test secret scanner
        run: node --test scripts/check-secret-leaks.node-test.mjs

      - name: Scan tracked tree and reviewed commit range
        shell: bash
        env:
          SECRET_SCAN_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          SECRET_SCAN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          node scripts/check-secret-leaks.mjs
          --base "$SECRET_SCAN_BASE_SHA"
          --head "$SECRET_SCAN_HEAD_SHA"

  build:
    needs: secret-scan
    strategy:
      matrix:
        node-version: [20.x, 22.6] # Need to use 22.6 due to Next.js build errors: https://github.com/vercel/next.js/issues/69263
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    name: Build with ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    env:
      BILLING_PLAN_ENV: test
      CLERK_SECRET_KEY: ci-placeholder-not-a-secret
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2kubHVzdGVyLmludmFsaWQk
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      STRIPE_SECRET_KEY: ci-placeholder-not-a-secret
      STRIPE_WEBHOOK_SECRET: ci-placeholder-not-a-secret
      STRIPE_CONNECT_WEBHOOK_SECRET: ci-placeholder-not-a-secret
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ci-placeholder-not-a-secret

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build

  full-vitest:
    name: Full Vitest Suite
    needs: secret-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # Required merge evidence must exercise the reviewed PR commit,
          # never GitHub's synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: HUSKY=0 npm ci

      - name: Run full Vitest suite
        run: npm run test:all

  test:
    needs: secret-scan
    strategy:
      matrix:
        node-version: [20.x]

    name: Run all tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: luster_e2e_ci_disposable
          POSTGRES_USER: luster_e2e_ci
          POSTGRES_PASSWORD: luster-e2e-ci-only-password
        ports:
          - '127.0.0.1:55432:5432'
        options: >-
          --health-cmd "pg_isready -U luster_e2e_ci -d luster_e2e_ci_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - '127.0.0.1:6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgresql://luster_e2e_ci:luster-e2e-ci-only-password@127.0.0.1:55432/luster_e2e_ci_disposable?application_name=luster-e2e-ci-disposable
      LUSTER_DISPOSABLE_DATABASE: 'true'
      BILLING_PLAN_ENV: test
      CLERK_SECRET_KEY: ci-placeholder-not-a-secret
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2kubHVzdGVyLmludmFsaWQk
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      STRIPE_SECRET_KEY: ci-placeholder-not-a-secret
      STRIPE_WEBHOOK_SECRET: ci-placeholder-not-a-secret
      STRIPE_CONNECT_WEBHOOK_SECRET: ci-placeholder-not-a-secret
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ci-placeholder-not-a-secret
      SUPER_ADMIN_AUTH_MODE: password
      SUPER_ADMIN_TEST_LOGIN_ENABLED: 'true'
      ALLOW_STAGING_SUPER_ADMIN_PASSWORD: 'true'
      LEGACY_OTP_AUTH_ENABLED: 'false'
      E2E_USE_REAL_TWILIO: 'false'
      TWILIO_ACCOUNT_SID: ''
      TWILIO_AUTH_TOKEN: ''
      TWILIO_VERIFY_SERVICE_SID: ''
      TWILIO_PHONE_NUMBER: ''
      RESEND_API_KEY: ''
      RESEND_FROM_EMAIL: ''
      RESEND_REPLY_TO_EMAIL: ''

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # Retrieve Git history, needed to verify commits
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # The deposits ladder is additive by construction. These paths carry the
      # SaaS billing surface, the migration set, the deploy manifest and the
      # salon-purge coverage pin.
      #
      # THREE of them are pinned to a hard ZERO DIFF for every PR in the ladder:
      # no packet may touch the billing webhook route, the SaaS billing surface
      # or the salon-purge coverage pin.
      #
      # The other two — `migrations` and `vercel.json` — cannot be zero-diff,
      # because the ladder is *defined* by packets that ship schema and crons:
      # D1 landed 0065 before this step existed, and D4 ships 0066 plus the
      # hold-reaper cron, both named in its frozen manifest. Pinning them to
      # zero would make the guard contradict the charters it exists to protect.
      # They are therefore held to an ADDITIVE ALLOWLIST, which is strictly
      # stronger than "unpinned" and still catches the drift the original step
      # was written to catch:
      #   * only chartered paths may change at all — any other migration file,
      #     or any other file under `migrations/`, still fails;
      #   * nothing may be DELETED or REWRITTEN — an edit to an already-shipped
      #     migration, or to an existing cron entry, still fails;
      #   * the only new journal tag and the only new cron path permitted are
      #     the ones the owning packet is chartered to add.
      # A later packet EXTENDS the two allowlists below; it does not remove the
      # check.
      #
      # This step lives in the `test` job because only its checkout sets
      # `fetch-depth: 0` — the shallow checkouts elsewhere cannot resolve
      # `git merge-base`.
      - name: Deposits ladder protected surfaces
        shell: bash
        run: |
          set -euo pipefail
          base="$(git merge-base origin/main HEAD)"

          # 1. Hard zero-diff. Unchanged from the original step.
          git diff --exit-code "$base" -- \
            src/app/api/webhooks/stripe/route.ts \
            src/app/api/billing \
            src/libs/salonPurge.ts

          # 2. Only chartered paths may change under the additive surfaces.
          while read -r file; do
            [ -n "$file" ] || continue
            case "$file" in
              migrations/0066_deposit_hold_awaiting_payment.sql) ;;
              migrations/meta/_journal.json) ;;
              vercel.json) ;;
              *)
                echo "::error::Unauthorized change to a protected ladder surface: $file"
                exit 1
                ;;
            esac
          done <<< "$(git diff --name-only "$base" -- migrations vercel.json)"

          # 3. Additive by construction: no deletions, no rewrites. This is what
          #    keeps an already-shipped migration or an existing cron immutable.
          removed="$(git diff --unified=0 "$base" -- migrations vercel.json \
            | grep -E '^-' | grep -vE '^--- ' || true)"
          if [ -n "$removed" ]; then
            echo "::error::The deposits ladder is additive by construction, but these lines were removed or rewritten:"
            printf '%s\n' "$removed"
            exit 1
          fi

          # 4. The additions themselves are allowlisted by content, so a packet
          #    cannot smuggle an extra migration or an extra cron through.
          new_tags="$(git diff --unified=0 "$base" -- migrations/meta/_journal.json \
            | grep -E '^\+.*"tag"' | sed -E 's/.*"tag" *: *"([^"]+)".*/\1/' || true)"
          if [ -n "$new_tags" ] && [ "$new_tags" != "0066_deposit_hold_awaiting_payment" ]; then
            echo "::error::Unauthorized migration journal entries:"
            printf '%s\n' "$new_tags"
            exit 1
          fi

          # Compared PER ENTRY against the chartered set, not as one joined
          # string: a packet that legitimately adds a cron alongside an earlier
          # one would otherwise fail on the concatenation rather than on its
          # content. The guard is unchanged in strength — anything not named
          # here still fails.
          new_crons="$(git diff --unified=0 "$base" -- vercel.json \
            | grep -E '^\+.*"path"' | sed -E 's/.*"path" *: *"([^"]+)".*/\1/' || true)"
          while read -r cron; do
            [ -n "$cron" ] || continue
            case "$cron" in
              /api/deposits/holds/reap) ;;
              /api/deposits/reconcile) ;;
              *)
                echo "::error::Unauthorized vercel.json cron entry: $cron"
                exit 1
                ;;
            esac
          done <<< "$new_crons"

      - name: Create ephemeral synthetic E2E admin credentials
        shell: bash
        run: |
          SYNTHETIC_PHONE="$(printf '%s%s%s' '999' '555' '0150')"
          SYNTHETIC_PASSWORD="ci-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}${RANDOM}"
          echo "::add-mask::${SYNTHETIC_PASSWORD}"
          {
            echo "E2E_SUPER_ADMIN_PHONE=${SYNTHETIC_PHONE}"
            echo "E2E_SUPER_ADMIN_PASSWORD=${SYNTHETIC_PASSWORD}"
          } >> "$GITHUB_ENV"

      - name: Test disposable database target guard
        run: npm run test:disposable-database-target

      # Static URL checks, Docker service identity checks, and live PostgreSQL
      # session attestation all complete before migrations or synthetic seeding.
      - name: Prepare disposable PostgreSQL for E2E
        run: npm run db:prepare:e2e:ci
        env:
          LUSTER_DISPOSABLE_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          LUSTER_DISPOSABLE_POSTGRES_NETWORK: ${{ job.services.postgres.network }}

      - name: Prove synthetic E2E fixture seeding is idempotent
        run: npm run db:seed:e2e
        env:
          LUSTER_DISPOSABLE_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          LUSTER_DISPOSABLE_POSTGRES_NETWORK: ${{ job.services.postgres.network }}

      # This suite is intentionally explicit. The default unit-test command
      # selects tests from the changed-file graph, so appointment behavior
      # could otherwise disappear from an unrelated release without running
      # the regression coverage that protects the mobile sheet.
      - name: Appointment sheet regression gate
        run: npm run test:appointment-regression

      - name: Build Next.js for E2E tests
        run: npm run build
        # PR-controlled builds validate the production bundle without provider
        # upload credentials. Trusted deployment remains responsible for Sentry
        # source-map upload coverage.

      - if: github.event_name == 'pull_request'
        name: Validate all commits from PR
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Linter
        run: npm run lint

      - name: Scan built client assets and runtime credentials
        run: npm run security:check-secrets -- --tree

      - name: Type checking
        run: npm run check-types

      - name: Run unit tests
        run: npm run test -- --coverage

      # Coverage is still collected on PRs. Only trusted main executes the
      # provider upload step with its repository credential.
      - name: Upload coverage reports to Codecov from trusted main
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Install Playwright (used for Storybook and E2E tests)
        run: npx playwright install --with-deps

      - name: Run storybook tests
        run: npm run test-storybook:ci

      # Functional visual assertions remain in Visual.e2e.ts for PRs, while
      # trusted main retains hosted snapshot publication.
      - name: Run E2E tests against disposable PostgreSQL
        if: github.event_name == 'pull_request'
        run: npm run test:e2e

      - name: Run E2E with trusted-main Percy coverage
        if: github.event_name == 'push'
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
        run: |
          if [ -n "$PERCY_TOKEN" ]; then
            npx percy exec -- npm run test:e2e
          else
            npm run test:e2e
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  client-lifecycle-postgres:
    name: Client lifecycle PostgreSQL stabilization
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    # This job is deliberately isolated from repository secrets and from every
    # shared/hosted database. These constants exist only inside the disposable
    # PostgreSQL service for this job.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lifecycle_ci
          POSTGRES_USER: lifecycle_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifecycle_ci -d lifecycle_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CLIENT_LIFECYCLE_TEST_DATABASE_URL: postgresql://lifecycle_ci@127.0.0.1:5432/lifecycle_ci
      CONCURRENCY_TEST_DATABASE_URL: postgresql://lifecycle_ci@127.0.0.1:5432/lifecycle_ci
      CLIENT_LIFECYCLE_DISPOSABLE_DATABASE_CONFIRMED: 'true'
      V133_COMMIT: 759b645ceb75d33c09fcc529450825e3781cfe79

    steps:
      - uses: actions/checkout@v4
        with:
          # The conditional v1.33 smoke uses the exact immutable Production
          # commit in a detached temporary worktree.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: HUSKY=0 npm ci

      - name: Verify the exercised staff reset is exact v1.33 code
        run: git diff --exit-code "$V133_COMMIT" -- src/libs/salonPurge.ts

      - name: Run real migration, concurrency, and directory suites
        run: npm run test:client-lifecycle:pg

      - name: Run focused lifecycle regressions
        run: npm run test:client-lifecycle:regression

      - name: Reset the disposable database for the command gate
        env:
          DATABASE_URL: postgresql://lifecycle_ci@127.0.0.1:5432/lifecycle_ci
        run: |
          node <<'NODE'
          const { Client } = require('pg');

          async function reset() {
            const client = new Client({
              connectionString: process.env.DATABASE_URL,
              application_name: 'client-lifecycle-ci-reset',
            });
            await client.connect();
            try {
              await client.query('drop schema if exists drizzle cascade');
              await client.query('drop schema if exists public cascade');
              await client.query('create schema public');
            } finally {
              await client.end();
            }
          }

          reset().catch(() => {
            process.stderr.write('Disposable PostgreSQL reset failed.\n');
            process.exitCode = 1;
          });
          NODE

      - name: Apply the protected lifecycle migration
        env:
          DATABASE_URL: postgresql://lifecycle_ci@127.0.0.1:5432/lifecycle_ci
        run: npm run db:migrate:client-lifecycle

      - name: Verify lifecycle schema readiness
        env:
          DATABASE_URL: postgresql://lifecycle_ci@127.0.0.1:5432/lifecycle_ci
        run: npm run db:verify:client-lifecycle

      - name: Prove protected migration no-op and readiness
        env:
          DATABASE_URL: postgresql://lifecycle_ci@127.0.0.1:5432/lifecycle_ci
        run: |
          npm run db:migrate:client-lifecycle
          npm run db:verify:client-lifecycle

      - name: Smoke stabilization health against the migrated schema
        env:
          DATABASE_URL: postgresql://lifecycle_ci@127.0.0.1:5432/lifecycle_ci
          CLERK_SECRET_KEY: ci-placeholder-not-a-secret
          STRIPE_SECRET_KEY: ci-placeholder-not-a-secret
          STRIPE_WEBHOOK_SECRET: ci-placeholder-not-a-secret
          STRIPE_CONNECT_WEBHOOK_SECRET: ci-placeholder-not-a-secret
          BILLING_PLAN_ENV: test
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ci-placeholder-not-a-secret
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ci-placeholder-not-a-secret
        run: |
          HEALTH_PID=''

          cleanup_health() {
            if [ -n "$HEALTH_PID" ] && kill -0 "$HEALTH_PID" 2>/dev/null; then
              kill "$HEALTH_PID" 2>/dev/null || true
              wait "$HEALTH_PID" 2>/dev/null || true
            fi
          }
          trap cleanup_health EXIT

          ./node_modules/.bin/next dev --hostname 127.0.0.1 --port 3107 \
            >/dev/null 2>&1 &
          HEALTH_PID=$!

          HEALTH_READY=false
          for _attempt in $(seq 1 45); do
            if curl -sS http://127.0.0.1:3107/api/health 2>/dev/null \
              | node -e '
                let input = "";
                process.stdin.setEncoding("utf8");
                process.stdin.on("data", chunk => input += chunk);
                process.stdin.on("end", () => {
                  try {
                    const body = JSON.parse(input);
                    process.exit(
                      body?.checks?.db === true
                      && body?.clientLifecycleSchema === "ready"
                        ? 0
                        : 1,
                    );
                  } catch {
                    process.exit(1);
                  }
                });
              '; then
              HEALTH_READY=true
              break
            fi
            sleep 1
          done

          test "$HEALTH_READY" = true
          echo '{"database":"ready","clientLifecycleSchema":"ready"}'
          cleanup_health
          trap - EXIT

      - name: Smoke exact v1.33 conditional DB compatibility
        env:
          DATABASE_URL: postgresql://lifecycle_ci@127.0.0.1:5432/lifecycle_ci
          CLERK_SECRET_KEY: ci-placeholder-not-a-secret
          STRIPE_SECRET_KEY: ci-placeholder-not-a-secret
          STRIPE_WEBHOOK_SECRET: ci-placeholder-not-a-secret
          STRIPE_CONNECT_WEBHOOK_SECRET: ci-placeholder-not-a-secret
          BILLING_PLAN_ENV: test
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ci-placeholder-not-a-secret
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ci-placeholder-not-a-secret
        run: |
          V133_WORKTREE="$RUNNER_TEMP/nailsalon-v133-lifecycle"
          V133_PID=''

          cleanup_v133() {
            if [ -n "$V133_PID" ] && kill -0 "$V133_PID" 2>/dev/null; then
              kill "$V133_PID" 2>/dev/null || true
              wait "$V133_PID" 2>/dev/null || true
            fi
            git worktree remove --force "$V133_WORKTREE" >/dev/null 2>&1 || true
          }
          trap cleanup_v133 EXIT

          git worktree add --detach "$V133_WORKTREE" "$V133_COMMIT"
          test "$(git -C "$V133_WORKTREE" rev-parse HEAD)" = "$V133_COMMIT"
          (
            cd "$V133_WORKTREE"
            HUSKY=0 npm ci
          )

          (
            cd "$V133_WORKTREE"
            exec ./node_modules/.bin/next dev --hostname 127.0.0.1 --port 3108 \
              >/dev/null 2>&1
          ) &
          V133_PID=$!

          V133_READY=false
          for _attempt in $(seq 1 45); do
            if curl -sS http://127.0.0.1:3108/api/health 2>/dev/null \
              | node -e '
                let input = "";
                process.stdin.setEncoding("utf8");
                process.stdin.on("data", chunk => input += chunk);
                process.stdin.on("end", () => {
                  try {
                    const body = JSON.parse(input);
                    process.exit(body?.checks?.db === true ? 0 : 1);
                  } catch {
                    process.exit(1);
                  }
                });
              '; then
              V133_READY=true
              break
            fi
            sleep 1
          done

          test "$V133_READY" = true
          echo '{"database":"ready","compatibility":"conditional"}'

          cleanup_v133
          trap - EXIT

  deposits-postgres-concurrency:
    name: D5 deposits PostgreSQL concurrency (zero skips)
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    # The suite refuses every hosted/private-network target. These constants
    # identify only this job's loopback-published PostgreSQL service, and the
    # live server address is independently attested against Docker metadata.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: luster_e2e_ci_disposable
          POSTGRES_USER: luster_e2e_ci
          POSTGRES_PASSWORD: luster-e2e-ci-only-password
        ports:
          - '127.0.0.1:55432:5432'
        options: >-
          --health-cmd "pg_isready -U luster_e2e_ci -d luster_e2e_ci_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://luster_e2e_ci:luster-e2e-ci-only-password@127.0.0.1:55432/luster_e2e_ci_disposable?application_name=luster-e2e-ci-disposable
      CONCURRENCY_TEST_DATABASE_URL: postgresql://luster_e2e_ci:luster-e2e-ci-only-password@127.0.0.1:55432/luster_e2e_ci_disposable?application_name=luster-e2e-ci-disposable
      LUSTER_DISPOSABLE_DATABASE: 'true'
      D5_CONCURRENCY_REQUIRED: 'true'
      BILLING_PLAN_ENV: test
      CLERK_SECRET_KEY: ci-placeholder-not-a-secret
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2kubHVzdGVyLmludmFsaWQk
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      STRIPE_SECRET_KEY: ci-placeholder-not-a-secret
      STRIPE_WEBHOOK_SECRET: ci-placeholder-not-a-secret
      STRIPE_CONNECT_WEBHOOK_SECRET: ci-placeholder-not-a-secret
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ci-placeholder-not-a-secret

    steps:
      - uses: actions/checkout@v4
        with:
          # Exercise the reviewed PR commit, never GitHub's synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: HUSKY=0 npm ci

      - name: Prepare the guarded disposable PostgreSQL target
        run: npm run db:prepare:e2e:ci
        env:
          LUSTER_DISPOSABLE_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          LUSTER_DISPOSABLE_POSTGRES_NETWORK: ${{ job.services.postgres.network }}

      - name: Run all D5 real-PostgreSQL races and prove zero skips
        shell: bash
        env:
          LUSTER_DISPOSABLE_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          LUSTER_DISPOSABLE_POSTGRES_NETWORK: ${{ job.services.postgres.network }}
        run: |
          set -euo pipefail
          npm run test:deposits:pg | tee d5-postgres-concurrency.log
          grep -Fqx \
            'D5_REAL_POSTGRES_TESTS_EXECUTED=5 D5_REAL_POSTGRES_TESTS_SKIPPED=0' \
            d5-postgres-concurrency.log

  booking-entitlement-override-postgres:
    name: Booking entitlement override PostgreSQL concurrency
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    # This job uses only a disposable loopback PostgreSQL service. The test
    # refuses to reset any database unless this explicit safety marker and the
    # connection's database/user/application identity all match.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: booking_entitlement_ci
          POSTGRES_USER: booking_entitlement_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booking_entitlement_ci -d booking_entitlement_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BOOKING_ENTITLEMENT_OVERRIDE_TEST_DATABASE_URL: postgresql://booking_entitlement_ci@127.0.0.1:5432/booking_entitlement_ci
      BOOKING_ENTITLEMENT_OVERRIDE_DISPOSABLE_DATABASE_CONFIRMED: 'true'
      CONCURRENCY_TEST_DATABASE_URL: postgresql://booking_entitlement_ci@127.0.0.1:5432/booking_entitlement_ci
      BOOKING_POLICY_ACKNOWLEDGMENT_DISPOSABLE_DATABASE_CONFIRMED: 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          # Exercise the reviewed PR commit itself, never GitHub's synthetic
          # merge ref. Push runs use the pushed commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: HUSKY=0 npm ci

      - name: Run Booking Experience entitlement override concurrency tests
        run: >-
          npx vitest run --no-file-parallelism
          'src/app/api/super-admin/organizations/[id]/entitlements/booking-experience-customization/route.concurrency.integration.test.ts'

      - name: Run required booking-policy acknowledgment PostgreSQL tests
        run: >-
          npx vitest run --no-file-parallelism
          src/app/api/appointments/route.concurrency.integration.test.ts

      # PGlite is single-connection and cannot interleave transactions, so the
      # concurrent-binding race can only be proved against a real server. This
      # step reuses the job's existing CONCURRENCY_TEST_DATABASE_URL and
      # BOOKING_POLICY_ACKNOWLEDGMENT_DISPOSABLE_DATABASE_CONFIRMED marker,
      # which the verbatim-copied guard already accepts — a deposits-specific
      # marker would make the suite silently skip here.
      - name: Run Stripe Connect binding concurrency tests
        run: >-
          npx vitest run --no-file-parallelism
          src/libs/stripeConnect/stripeConnect.concurrency.integration.test.ts

  synchronize-with-crowdin:
    name: Crowdin sync excluded from PR-head
    runs-on: ubuntu-latest

    needs: [build, test]
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # The previous action exposed Crowdin credentials to PR-head code. This
      # check names the exclusion honestly until broader trusted automation is
      # handled outside this narrowly scoped database-isolation PR.
      - name: Confirm PR localization sync exclusion
        run: echo "Crowdin synchronization is intentionally excluded from PR-head execution."
