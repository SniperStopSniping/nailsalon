            migration_0094_sql_sha256="$(sha256sum migrations/0094_billing_phone_identity.sql | awk '{print $1}')"
            migration_0094_snapshot_sha256="$(sha256sum migrations/meta/0094_snapshot.json | awk '{print $1}')"
            if [ "$migration_0094_sql_sha256" != "3f4e68b334ea99b07087a95ea13a80f70b6d53fa4573c5f725c059233eab3c17" ] \
              || [ "$migration_0094_snapshot_sha256" != "e1d16bcee3729a7bb2eeec439e680764d051c5fb1fc7b4700619c8c1a7a8d3ce" ]; then
              echo "::error::Migration 0094 artifacts do not match the reviewed phone-identity postimage."
              exit 1
            fi
          fi

          expected_0094_journal='{"breakpoints":true,"idx":93,"tag":"0094_billing_phone_identity","version":"7","when":1790609459475}'
          actual_0094_journal="$(jq -cS '.entries[] | select(.tag == "0094_billing_phone_identity")' migrations/meta/_journal.json)"
          if [ "$actual_0094_journal" != "$expected_0094_journal" ]; then
