            if [ "$migration_0097_sql_sha256" != "99c798be3d33bbedb72046cccd1616747452625c40d70ccceca2e59c46c813b7" ] \
              || [ "$migration_0097_snapshot_sha256" != "61ea38d8397b7338cfeb20bcba25e7fdff4221e735f8bc7fc9b71c92c525e12a" ]; then
