          npx vitest run --no-file-parallelism --reporter=json \
            --outputFile="$RUNNER_TEMP/next-visit-offer-postgres.json" \
            src/libs/nextVisitOffer.concurrency.integration.test.ts
          node - "$RUNNER_TEMP/next-visit-offer-postgres.json" <<'NODE'
          const { readFileSync } = require('node:fs');
          const report = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const assertions = report.testResults?.flatMap(file => file.assertionResults ?? []) ?? [];
          if (
            report.success !== true
            || report.numTotalTests !== 4
            || report.numPassedTests !== 4
            || report.numFailedTests !== 0
            || report.numPendingTests !== 0
            || report.numTodoTests !== 0
            || report.testResults?.length !== 1
            || assertions.length !== 4
            || assertions.some(test => test.status !== 'passed')
          ) {
            process.stderr.write('Next Visit offer PostgreSQL run did not execute all 4 cases successfully.\n');
            process.exit(1);
          }
          console.log('NEXT_VISIT_POSTGRES_TESTS_EXECUTED=4 NEXT_VISIT_POSTGRES_TESTS_SKIPPED=0');
          NODE

