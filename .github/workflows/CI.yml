          # Compared PER ENTRY against the chartered set, not as one joined
          # string: a packet that legitimately adds a cron alongside an earlier
          # one would otherwise fail on the concatenation rather than on its
          # content. The guard is unchanged in strength — anything not named
          # here still fails.
          new_crons="$(git diff --unified=0 "$base" -- vercel.json \
            | grep -E '^\+.*"path"' | sed -E 's/.*"path" *: *"([^"]+)".*/\1/' || true)"
          while read -r cron; do
            [ -n "$cron" ] || continue
