          LUSTER_DISPOSABLE_POSTGRES_NETWORK: ${{ job.services.postgres.network }}
        run: PLAYWRIGHT_JSON_OUTPUT_FILE=test-results/app24-e2e-results.json npm run test:e2e -- tests/e2e/mobile-staff-uiqi.e2e.ts tests/e2e/booking-layout-variants.e2e.ts tests/e2e/quick-book-designs.e2e.ts tests/e2e/account-gate-contrast.e2e.ts tests/e2e/booking-page-hub.e2e.ts tests/e2e/review-requests.e2e.ts tests/e2e/network-no-show-protection.e2e.ts tests/e2e/salon-no-show-records.e2e.ts tests/e2e/rebooking-reminders.e2e.ts --reporter=github,json

      - name: Verify authoritative L1 public booking in mobile Chromium and WebKit
        env:
          CONCURRENCY_TEST_DATABASE_URL: postgresql://luster_e2e_ci:luster-e2e-ci-only-password@127.0.0.1:55432/luster_e2e_ci_disposable?application_name=luster-e2e-ci-disposable
          LUSTER_DISPOSABLE_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          LUSTER_DISPOSABLE_POSTGRES_NETWORK: ${{ job.services.postgres.network }}
          NEXT_PUBLIC_APP_URL: http://localhost:3101
          APP_URL: http://localhost:3101
        run: npx playwright test --config tests/browser/l1-public-booking/playwright.config.ts

      - name: Run E2E with trusted-main Percy coverage
        if: github.event_name == 'push'
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          LUSTER_DISPOSABLE_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          LUSTER_DISPOSABLE_POSTGRES_NETWORK: ${{ job.services.postgres.network }}
        run: |
          set -euo pipefail
          if [ -n "$PERCY_TOKEN" ]; then
            PERCY_BROWSER_EXECUTABLE="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')"
            export PERCY_BROWSER_EXECUTABLE
            test -n "$PERCY_BROWSER_EXECUTABLE"
            test -f "$PERCY_BROWSER_EXECUTABLE"
            test -x "$PERCY_BROWSER_EXECUTABLE"
            npx percy exec -- npm run test:e2e -- tests/e2e/mobile-staff-uiqi.e2e.ts tests/e2e/booking-layout-variants.e2e.ts tests/e2e/account-gate-contrast.e2e.ts tests/e2e/booking-page-hub.e2e.ts tests/e2e/review-requests.e2e.ts tests/e2e/network-no-show-protection.e2e.ts tests/e2e/salon-no-show-records.e2e.ts
          else
            npm run test:e2e -- tests/e2e/mobile-staff-uiqi.e2e.ts tests/e2e/booking-layout-variants.e2e.ts tests/e2e/account-gate-contrast.e2e.ts tests/e2e/booking-page-hub.e2e.ts tests/e2e/review-requests.e2e.ts tests/e2e/network-no-show-protection.e2e.ts tests/e2e/salon-no-show-records.e2e.ts
