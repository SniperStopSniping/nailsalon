          grep -Fqx '# tests 3' percy-browser-override.tap
          grep -Fqx '# pass 3' percy-browser-override.tap
          grep -Fqx '# skipped 0' percy-browser-override.tap

      # Functional visual assertions remain in Visual.e2e.ts for PRs, while
