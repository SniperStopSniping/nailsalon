name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret hygiene
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Test secret scanner
        run: node --test scripts/check-secret-leaks.node-test.mjs

      - name: Scan tracked tree and reviewed commit range
        shell: bash
        env:
          SECRET_SCAN_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          SECRET_SCAN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          node scripts/check-secret-leaks.mjs
          --base "$SECRET_SCAN_BASE_SHA"
          --head "$SECRET_SCAN_HEAD_SHA"

  build:
    needs: secret-scan
    strategy:
      matrix:
        node-version: [20.x, 22.6] # Need to use 22.6 due to Next.js build errors: https://github.com/vercel/next.js/issues/69263
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    name: Build with ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    env:
      BILLING_PLAN_ENV: test
      CLERK_SECRET_KEY: ci-placeholder-not-a-secret
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2kubHVzdGVyLmludmFsaWQk
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      STRIPE_SECRET_KEY: ci-placeholder-not-a-secret
      STRIPE_WEBHOOK_SECRET: ci-placeholder-not-a-secret
      STRIPE_CONNECT_WEBHOOK_SECRET: ci-placeholder-not-a-secret
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ci-placeholder-not-a-secret

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build

  full-vitest:
    name: Full Vitest Suite
    needs: secret-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # Required merge evidence must exercise the reviewed PR commit,
          # never GitHub's synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: HUSKY=0 npm ci

      - name: Run full Vitest suite
        run: npm run test:all

  test:
    needs: secret-scan
    strategy:
      matrix:
        node-version: [20.x]

    name: Run all tests
    runs-on: ubuntu-latest
    # Every other long-running job here is bounded (15-25m). This one was not,
    # so it inherited GitHub's 6-hour default. When the Playwright install step
    # below stalled on main, the job sat for 5h54m before that default killed
    # it, which cancelled the whole CI run -- and because Release gates on
    # `workflow_run.conclusion == 'success'`, a cancelled CI silently skipped
    # the release. Generous versus the ~12m this job actually takes, because
    # the point is to bound a hang, not to police normal variance.
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: luster_e2e_ci_disposable
          POSTGRES_USER: luster_e2e_ci
          POSTGRES_PASSWORD: luster-e2e-ci-only-password
        ports:
          - '127.0.0.1:55432:5432'
        options: >-
          --health-cmd "pg_isready -U luster_e2e_ci -d luster_e2e_ci_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - '127.0.0.1:6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgresql://luster_e2e_ci:luster-e2e-ci-only-password@127.0.0.1:55432/luster_e2e_ci_disposable?application_name=luster-e2e-ci-disposable
      LUSTER_DISPOSABLE_DATABASE: 'true'
      BILLING_PLAN_ENV: test
      CLERK_SECRET_KEY: ci-placeholder-not-a-secret
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2kubHVzdGVyLmludmFsaWQk
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      STRIPE_SECRET_KEY: ci-placeholder-not-a-secret
      STRIPE_WEBHOOK_SECRET: ci-placeholder-not-a-secret
      STRIPE_CONNECT_WEBHOOK_SECRET: ci-placeholder-not-a-secret
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ci-placeholder-not-a-secret
      SUPER_ADMIN_AUTH_MODE: password
      SUPER_ADMIN_TEST_LOGIN_ENABLED: 'true'
      ALLOW_STAGING_SUPER_ADMIN_PASSWORD: 'true'
      LEGACY_OTP_AUTH_ENABLED: 'false'
      E2E_USE_REAL_TWILIO: 'false'
      TWILIO_ACCOUNT_SID: ''
      TWILIO_AUTH_TOKEN: ''
      TWILIO_VERIFY_SERVICE_SID: ''
      TWILIO_PHONE_NUMBER: ''
      RESEND_API_KEY: ''
      RESEND_FROM_EMAIL: ''
      RESEND_REPLY_TO_EMAIL: ''

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # Retrieve Git history, needed to verify commits
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # The deposits ladder is additive by construction. These paths carry the
      # SaaS billing surface, dependency manifests, migration set, deploy
      # manifest, and salon-purge coverage contract.
      #
      # The billing webhook route, SaaS billing surface, and dependency
      # manifests are pinned to a hard ZERO DIFF for every PR in the ladder.
      # D6's salon-purge extension is separately pinned to an exact additive
      # postimage: its reviewed registration and preflight may be added, while
      # no existing line may be removed or rewritten.
      #
      # The other two — `migrations` and `vercel.json` — cannot be zero-diff,
      # because the ladder is *defined* by packets that ship schema and crons:
      # D1 landed 0065 before this step existed, and D4 ships 0066 plus the
      # hold-reaper cron, both named in its frozen manifest. Pinning them to
      # zero would make the guard contradict the charters it exists to protect.
      # They are therefore held to an ADDITIVE ALLOWLIST, which is strictly
      # stronger than "unpinned" and still catches the drift the original step
      # was written to catch:
      #   * only chartered paths may change at all — any other migration file,
      #     or any other file under `migrations/`, still fails;
      #   * nothing may be DELETED or REWRITTEN — an edit to an already-shipped
      #     migration, or to an existing cron entry, still fails;
      #   * the only new journal tag and the only new cron path permitted are
      #     the ones the owning packet is chartered to add.
      # A later packet EXTENDS the two allowlists below; it does not remove the
      # check.
      #
      # This step lives in the `test` job because only its checkout sets
      # `fetch-depth: 0` — the shallow checkouts elsewhere cannot resolve
      # `git merge-base`.
      - name: Deposits ladder protected surfaces
        shell: bash
        run: |
          set -euo pipefail
          base="$(git merge-base origin/main HEAD)"

          # 1. Hard zero-diff. D6 adds dependency manifests to the protected set.
          #    Gate C2 narrowed the billing freeze: the PORTAL route (the one
          #    production-used billing surface) stays byte-frozen here, while
          #    the checkout surface moved to the reviewed-postimage allowlist
          #    in step 1b — its legacy body accepted a client-supplied Stripe
          #    priceId and was replaced by the server-authoritative C2 route.
          git diff --exit-code "$base" -- \
            src/app/api/webhooks/stripe/route.ts \
            src/app/api/billing/portal \
            package.json \
            package-lock.json

          # 1b. Billing checkout surface (Gate C2). Only the enumerated paths
          #     may change under src/app/api/billing, and the route itself
          #     must match a reviewed postimage. Extend this list per reviewed
          #     change; never remove entries — historical freezes stay frozen.
          while read -r file; do
            [ -n "$file" ] || continue
            case "$file" in
              src/app/api/billing/checkout/route.ts) ;;
              src/app/api/billing/checkout/route.test.ts) ;;
              src/app/api/billing/windows/evaluate/route.ts) ;;
              src/app/api/billing/reconcile/route.ts) ;;
              src/app/api/billing/reconcile/route.test.ts) ;;
              src/app/api/billing/checkout/topup/route.ts) ;;
              src/app/api/billing/checkout/topup/route.test.ts) ;;
              *)
                echo "::error::Unauthorized change under src/app/api/billing: $file"
                exit 1
                ;;
            esac
          done <<< "$(git diff --name-only "$base" -- src/app/api/billing)"
          if ! git diff --quiet "$base" -- src/app/api/billing/checkout/route.ts; then
            checkout_blob="$(git hash-object src/app/api/billing/checkout/route.ts)"
            case "$checkout_blob" in
              # Reviewed postimages: Gate C2 server-authoritative checkout.
              ce148781b0f8b28aa2b94f9f623b06869871337f) ;;
              # + §2.3 typed duplicate-subscription refusals.
              90b8019c1d545de917763ffb9d983f6eb5f04edd) ;;
              *)
                echo "::error::src/app/api/billing/checkout/route.ts must match a reviewed postimage."
                printf 'actual blob: %s\n' "$checkout_blob"
                exit 1
                ;;
            esac
          fi

          # 2. D6's salon-purge edit is additive and byte-exact. The postimage
          #    contains only the appointment_deposit registration, the two
          #    named unsettled predicates, and the common purge preflight.
          if ! git diff --quiet "$base" -- src/libs/salonPurge.ts; then
            salon_purge_removed="$(git diff --unified=0 "$base" -- src/libs/salonPurge.ts \
              | grep -E '^-' | grep -vE '^--- ' || true)"
            if [ -n "$salon_purge_removed" ]; then
              echo "::error::The D6 salon-purge allowlist is additive; existing lines may not be removed or rewritten."
              printf '%s\n' "$salon_purge_removed"
              exit 1
            fi

            salon_purge_blob="$(git hash-object src/libs/salonPurge.ts)"
            case "$salon_purge_blob" in
              # Reviewed postimages: D6 baseline, then Gate B1 (billing purge
              # steps). Extend this list per reviewed change; never remove.
              ba5eaf44ce96b6f217d94c71268d8261bc5bfe24) ;;
              f75af0c6fa6d6be326ffb6f1272c51ea7fa2f1fe) ;;
              e423780a1d92122518864f20b801b0302bdb42a6) ;;
              # Discover PR1: registers salon_portfolio_photo and
              # salon_discover_settings purge steps, the cross-tenant
              # technician-reference check, and the technician null-out.
              # Strictly additive over the Gate B1 postimage above.
              a9bee33c090b68feb4b8f3c9c351bc2bf7040b56) ;;
              *)
                echo "::error::Unauthorized change outside the reviewed salon-purge postimages."
                printf 'actual blob: %s\n' "$salon_purge_blob"
                exit 1
                ;;
            esac
          fi

          # 3. Only the current packet's chartered paths may change under the
          #    additive surfaces. Previously shipped migrations are deliberately
          #    absent: any later edit to 0066 or 0067 must fail.
          while read -r file; do
            [ -n "$file" ] || continue
            case "$file" in
              migrations/0068_deposit_credit_tax_snapshots.sql) ;;
              migrations/0069_billing_credit_foundation.sql) ;;
              migrations/0070_communications_pipeline.sql) ;;
              # Discover PR1 — portfolio foundation (docs/DISCOVER_V1_BRIEF.md).
              migrations/0071_discover_portfolio_foundation.sql) ;;
              # Luster L1 PR1 — dark catalog foundation.
              migrations/0072_l1_catalog_foundation.sql) ;;
              # Luster L1 PR2 — dark catalog grouping / capability / rule
              # foundation.
              migrations/0073_l1_catalog_rules_foundation.sql) ;;
              migrations/meta/_journal.json) ;;
              vercel.json) ;;
              *)
                echo "::error::Unauthorized change to a protected ladder surface: $file"
                exit 1
                ;;
            esac
          done <<< "$(git diff --name-only "$base" -- migrations vercel.json)"

          # 4. Additive by construction: no deletions, no rewrites. This is what
          #    keeps an already-shipped migration or an existing cron immutable.
          removed="$(git diff --unified=0 "$base" -- migrations vercel.json \
            | grep -E '^-' | grep -vE '^--- ' || true)"
          if [ -n "$removed" ]; then
            echo "::error::The deposits ladder is additive by construction, but these lines were removed or rewritten:"
            printf '%s\n' "$removed"
            exit 1
          fi

          # 5. D6.1 may add 0068 exactly once and only with its reviewed
          #    postimage. Once origin/main contains it, every subsequent edit is
          #    rejected even if the edit is additive. The journal follows the
          #    same one-packet rule, preventing additive mutation of old entries.
          if ! git diff --quiet "$base" -- migrations/0068_deposit_credit_tax_snapshots.sql; then
            if git cat-file -e "$base:migrations/0068_deposit_credit_tax_snapshots.sql" 2>/dev/null; then
              echo "::error::Migration 0068 is already shipped and is immutable."
              exit 1
            fi
            migration_0068_status="$(git diff --name-status "$base" -- migrations/0068_deposit_credit_tax_snapshots.sql)"
            if [ "$migration_0068_status" != $'A\tmigrations/0068_deposit_credit_tax_snapshots.sql' ]; then
              echo "::error::Migration 0068 must be introduced as one new file."
              printf 'actual status: %s\n' "$migration_0068_status"
              exit 1
            fi
            migration_0068_blob="$(git hash-object migrations/0068_deposit_credit_tax_snapshots.sql)"
            if [ "$migration_0068_blob" != "ea99188b3e4a55730ee10f372b731ddfc1930124" ]; then
              echo "::error::Migration 0068 does not match the reviewed D6.1 postimage."
              printf 'actual blob: %s\n' "$migration_0068_blob"
              exit 1
            fi
          fi

          if ! git diff --quiet "$base" -- migrations/meta/_journal.json; then
            # Shipped journal entries are IMMUTABLE, but later chartered
            # packets legitimately APPEND (0069/0070 below). A line-level or
            # blob pin cannot express that — appending an entry adds a comma
            # to the previous last entry — so immutability is enforced by
            # CONTENT: the shipped entry list must be a strict prefix of the
            # new one, and the journal header must be untouched. Step 6 then
            # bounds WHAT may be appended.
            base_entry_count="$(git show "$base:migrations/meta/_journal.json" | jq '.entries | length')"
            if ! diff \
              <(git show "$base:migrations/meta/_journal.json" | jq -S '.entries') \
              <(jq -S ".entries[:$base_entry_count]" migrations/meta/_journal.json) >/dev/null; then
              echo "::error::Shipped migration journal entries are immutable (append-only)."
              exit 1
            fi
            if [ "$(git show "$base:migrations/meta/_journal.json" | jq -cS 'del(.entries)')" \
              != "$(jq -cS 'del(.entries)' migrations/meta/_journal.json)" ]; then
              echo "::error::The migration journal header is immutable."
              exit 1
            fi
          fi

          # 6. The additions themselves are allowlisted by content, so a packet
          #    cannot smuggle an extra migration or an extra cron through.
          new_tags="$(git diff --unified=0 "$base" -- migrations/meta/_journal.json \
            | grep -E '^\+.*"tag"' | sed -E 's/.*"tag" *: *"([^"]+)".*/\1/' || true)"
          while read -r tag; do
            [ -n "$tag" ] || continue
            case "$tag" in
              0068_deposit_credit_tax_snapshots) ;;
              0069_billing_credit_foundation) ;;
              0070_communications_pipeline) ;;
              # Discover PR1 — portfolio foundation (docs/DISCOVER_V1_BRIEF.md).
              0071_discover_portfolio_foundation) ;;
              # Luster L1 PR1 — dark catalog foundation.
              0072_l1_catalog_foundation) ;;
              # Luster L1 PR2 — dark catalog grouping / capability / rule
              # foundation.
              0073_l1_catalog_rules_foundation) ;;
              *)
                echo "::error::Unauthorized migration journal entries: $tag"
                exit 1
                ;;
            esac
          done <<< "$new_tags"

          # Compared PER ENTRY against the chartered set, not as one joined
          # string: a packet that legitimately adds a cron alongside an earlier
          # one would otherwise fail on the concatenation rather than on its
          # content. The guard is unchanged in strength — anything not named
          # here still fails.
          new_crons="$(git diff --unified=0 "$base" -- vercel.json \
            | grep -E '^\+.*"path"' | sed -E 's/.*"path" *: *"([^"]+)".*/\1/' || true)"
          while read -r cron; do
            [ -n "$cron" ] || continue
            case "$cron" in
              /api/deposits/holds/reap) ;;
              /api/deposits/reconcile) ;;
              /api/communications/dispatch) ;;
              *)
                echo "::error::Unauthorized vercel.json cron entry: $cron"
                exit 1
                ;;
            esac
          done <<< "$new_crons"

      - name: Create ephemeral synthetic E2E admin credentials
        shell: bash
        run: |
          SYNTHETIC_PHONE="$(printf '%s%s%s' '999' '555' '0150')"
          SYNTHETIC_PASSWORD="ci-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}${RANDOM}"
          echo "::add-mask::${SYNTHETIC_PASSWORD}"
          {
            echo "E2E_SUPER_ADMIN_PHONE=${SYNTHETIC_PHONE}"
            echo "E2E_SUPER_ADMIN_PASSWORD=${SYNTHETIC_PASSWORD}"
          } >> "$GITHUB_ENV"

      - name: Test disposable database target guard
        run: npm run test:disposable-database-target

      # Static URL checks, Docker service identity checks, and live PostgreSQL
      # session attestation all complete before migrations or synthetic seeding.
      - name: Prepare disposable PostgreSQL for E2E
        run: npm run db:prepare:e2e:ci
        env:
          LUSTER_DISPOSABLE_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          LUSTER_DISPOSABLE_POSTGRES_NETWORK: ${{ job.services.postgres.network }}

      - name: Prove synthetic E2E fixture seeding is idempotent
        run: npm run db:seed:e2e
        env:
          LUSTER_DISPOSABLE_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          LUSTER_DISPOSABLE_POSTGRES_NETWORK: ${{ job.services.postgres.network }}

      # This suite is intentionally explicit. The default unit-test command
      # selects tests from the changed-file graph, so appointment behavior
      # could otherwise disappear from an unrelated release without running
      # the regression coverage that protects the mobile sheet.
      - name: Appointment sheet regression gate
        run: npm run test:appointment-regression

      - name: Build Next.js for E2E tests
        run: npm run build
        # PR-controlled builds validate the production bundle without provider
        # upload credentials. Trusted deployment remains responsible for Sentry
        # source-map upload coverage.

      - if: github.event_name == 'pull_request'
        name: Validate all commits from PR
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Linter
        run: npm run lint

      - name: Scan built client assets and runtime credentials
        run: npm run security:check-secrets -- --tree

      - name: Type checking
        run: npm run check-types

      - name: Run unit tests
        run: npm run test -- --coverage

      # Coverage is still collected on PRs. Only trusted main executes the
      # provider upload step with its repository credential.
      - name: Upload coverage reports to Codecov from trusted main
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # `npx playwright install --with-deps` does unbounded external work: an
      # apt-get pass against the Ubuntu/Microsoft/Google mirrors, then a browser
      # download from Playwright's CDN. It normally finishes in ~3 minutes, but
      # it has stalled indefinitely three separate times -- twice on main and
      # once on a pull request -- with no output and no failure. Nothing bounded
      # it, so a transient network stall consumed an entire CI run instead of
      # failing fast.
      #
      # Each attempt is capped, and a stalled attempt is retried rather than
      # waited on. Test coverage is unchanged: the same command installs the
      # same browsers, and a genuine install failure still fails the job after
      # the final attempt (`exit 1`) rather than being swallowed.
      - name: Install Playwright (used for Storybook and E2E tests)
        timeout-minutes: 27
        run: |
          for attempt in 1 2 3; do
            echo "::group::Playwright install attempt ${attempt}/3"
            status=0
            timeout 480 npx playwright install --with-deps || status=$?
            echo "::endgroup::"
            if [ "${status}" -eq 0 ]; then
              echo "Playwright install succeeded on attempt ${attempt}."
              exit 0
            fi
            if [ "${status}" -eq 124 ]; then
              echo "Attempt ${attempt} exceeded the 480s cap and was terminated."
            else
              echo "Attempt ${attempt} failed with exit status ${status}."
            fi
            sleep 10
          done
          echo "Playwright install did not succeed in 3 bounded attempts."
          exit 1

      - name: Run storybook tests
        run: npm run test-storybook:ci

      # Functional visual assertions remain in Visual.e2e.ts for PRs, while
      # trusted main retains hosted snapshot publication.
      - name: Run E2E tests against disposable PostgreSQL
        if: github.event_name == 'pull_request'
        run: npm run test:e2e

      - name: Run E2E with trusted-main Percy coverage
        if: github.event_name == 'push'
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
        run: |
          if [ -n "$PERCY_TOKEN" ]; then
            npx percy exec -- npm run test:e2e
          else
            npm run test:e2e
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  client-lifecycle-postgres:
    name: Client lifecycle PostgreSQL stabilization
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    # This job is deliberately isolated from repository secrets and from every
    # shared/hosted database. These constants exist only inside the disposable
    # PostgreSQL service for this job.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lifecycle_ci
          POSTGRES_USER: lifecycle_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifecycle_ci -d lifecycle_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CLIENT_LIFECYCLE_TEST_DATABASE_URL: postgresql://lifecycle_ci@127.0.0.1:5432/lifecycle_ci
      CONCURRENCY_TEST_DATABASE_URL: postgresql://lifecycle_ci@127.0.0.1:5432/lifecycle_ci
      CLIENT_LIFECYCLE_DISPOSABLE_DATABASE_CONFIRMED: 'true'
      V133_COMMIT: c357c429cac10687bdd39c7cc064a252e18f55a6

    steps:
      - uses: actions/checkout@v4
        with:
          # The conditional compatibility smoke uses the exact reviewed head
          # commit in a detached temporary worktree.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: HUSKY=0 npm ci

      - name: Verify the exercised staff reset is additive over the reviewed head
        run: |
          set -euo pipefail
          # Byte-exact pinning contradicts the deposits-ladder guard, which
          # explicitly permits reviewed ADDITIVE extensions of salonPurge.ts
          # (Gate B registers its billing/communications purge steps). The
          # reviewed-postimage blob allowlist in the `test` job carries the
          # exact-content review; here we require only that nothing the V133
          # head shipped was removed or rewritten.
          removed="$(git diff --unified=0 "$V133_COMMIT" -- src/libs/salonPurge.ts \
            | grep -E '^-' | grep -vE '^--- ' || true)"
          if [ -n "$removed" ]; then
            echo "::error::salonPurge.ts must remain additive over the V133 reviewed head."
            printf '%s\n' "$removed"
            exit 1
          fi

      - name: Run real migration, concurrency, and directory suites
        run: npm run test:client-lifecycle:pg

      - name: Run focused lifecycle regressions
        run: npm run test:client-lifecycle:regression

      - name: Reset the disposable database for the command gate
        env:
          DATABASE_URL: postgresql://lifecycle_ci@127.0.0.1:5432/lifecycle_ci
        run: |
          node <<'NODE'
          const { Client } = require('pg');

          async function reset() {
            const client = new Client({
              connectionString: process.env.DATABASE_URL,
              application_name: 'client-lifecycle-ci-reset',
            });
            await client.connect();
            try {
              await client.query('drop schema if exists drizzle cascade');
              await client.query('drop schema if exists public cascade');
              await client.query('create schema public');
            } finally {
              await client.end();
            }
          }

          reset().catch(() => {
            process.stderr.write('Disposable PostgreSQL reset failed.\n');
            process.exitCode = 1;
          });
          NODE

      - name: Apply the protected lifecycle migration
        env:
          DATABASE_URL: postgresql://lifecycle_ci@127.0.0.1:5432/lifecycle_ci
        run: npm run db:migrate:client-lifecycle

      - name: Verify lifecycle schema readiness
        env:
          DATABASE_URL: postgresql://lifecycle_ci@127.0.0.1:5432/lifecycle_ci
        run: npm run db:verify:client-lifecycle

      - name: Prove protected migration no-op and readiness
        env:
          DATABASE_URL: postgresql://lifecycle_ci@127.0.0.1:5432/lifecycle_ci
        run: |
          npm run db:migrate:client-lifecycle
          npm run db:verify:client-lifecycle

      # schemaDrift compares the expected migration tail
      # (migrations/meta/_journal.json) against how many migrations this
      # real, disposable Postgres has actually applied. Asserting "ready"
      # here, against a genuinely migrated database rather than a mock, is
      # deployment visibility for the class of incident where code shipped
      # expecting migrations through 0072 while the database was still at
      # 0068. The dedicated behind/ahead/malformed/query-failure states are
      # proven deterministically in src/libs/schemaReadinessCore.test.ts,
      # which every PR already runs via the standard Vitest jobs.
      - name: Smoke stabilization health against the migrated schema
        env:
          DATABASE_URL: postgresql://lifecycle_ci@127.0.0.1:5432/lifecycle_ci
          CLERK_SECRET_KEY: ci-placeholder-not-a-secret
          STRIPE_SECRET_KEY: ci-placeholder-not-a-secret
          STRIPE_WEBHOOK_SECRET: ci-placeholder-not-a-secret
          STRIPE_CONNECT_WEBHOOK_SECRET: ci-placeholder-not-a-secret
          BILLING_PLAN_ENV: test
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ci-placeholder-not-a-secret
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ci-placeholder-not-a-secret
        run: |
          HEALTH_PID=''

          cleanup_health() {
            if [ -n "$HEALTH_PID" ] && kill -0 "$HEALTH_PID" 2>/dev/null; then
              kill "$HEALTH_PID" 2>/dev/null || true
              wait "$HEALTH_PID" 2>/dev/null || true
            fi
          }
          trap cleanup_health EXIT

          ./node_modules/.bin/next dev --hostname 127.0.0.1 --port 3107 \
            >/dev/null 2>&1 &
          HEALTH_PID=$!

          HEALTH_READY=false
          for _attempt in $(seq 1 45); do
            if curl -sS http://127.0.0.1:3107/api/health 2>/dev/null \
              | node -e '
                let input = "";
                process.stdin.setEncoding("utf8");
                process.stdin.on("data", chunk => input += chunk);
                process.stdin.on("end", () => {
                  try {
                    const body = JSON.parse(input);
                    process.exit(
                      body?.checks?.db === true
                      && body?.clientLifecycleSchema === "ready"
                      && body?.schemaDrift === "ready"
                        ? 0
                        : 1,
                    );
                  } catch {
                    process.exit(1);
                  }
                });
              '; then
              HEALTH_READY=true
              break
            fi
            sleep 1
          done

          test "$HEALTH_READY" = true
          echo '{"database":"ready","clientLifecycleSchema":"ready","schemaDrift":"ready"}'
          cleanup_health
          trap - EXIT

      - name: Smoke reviewed-head conditional DB compatibility
        env:
          DATABASE_URL: postgresql://lifecycle_ci@127.0.0.1:5432/lifecycle_ci
          CLERK_SECRET_KEY: ci-placeholder-not-a-secret
          STRIPE_SECRET_KEY: ci-placeholder-not-a-secret
          STRIPE_WEBHOOK_SECRET: ci-placeholder-not-a-secret
          STRIPE_CONNECT_WEBHOOK_SECRET: ci-placeholder-not-a-secret
          BILLING_PLAN_ENV: test
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ci-placeholder-not-a-secret
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ci-placeholder-not-a-secret
        run: |
          V133_WORKTREE="$RUNNER_TEMP/nailsalon-v133-lifecycle"
          V133_PID=''

          cleanup_v133() {
            if [ -n "$V133_PID" ] && kill -0 "$V133_PID" 2>/dev/null; then
              kill "$V133_PID" 2>/dev/null || true
              wait "$V133_PID" 2>/dev/null || true
            fi
            git worktree remove --force "$V133_WORKTREE" >/dev/null 2>&1 || true
          }
          trap cleanup_v133 EXIT

          git worktree add --detach "$V133_WORKTREE" "$V133_COMMIT"
          test "$(git -C "$V133_WORKTREE" rev-parse HEAD)" = "$V133_COMMIT"
          (
            cd "$V133_WORKTREE"
            HUSKY=0 npm ci
          )

          (
            cd "$V133_WORKTREE"
            exec ./node_modules/.bin/next dev --hostname 127.0.0.1 --port 3108 \
              >/dev/null 2>&1
          ) &
          V133_PID=$!

          V133_READY=false
          for _attempt in $(seq 1 45); do
            if curl -sS http://127.0.0.1:3108/api/health 2>/dev/null \
              | node -e '
                let input = "";
                process.stdin.setEncoding("utf8");
                process.stdin.on("data", chunk => input += chunk);
                process.stdin.on("end", () => {
                  try {
                    const body = JSON.parse(input);
                    process.exit(body?.checks?.db === true ? 0 : 1);
                  } catch {
                    process.exit(1);
                  }
                });
              '; then
              V133_READY=true
              break
            fi
            sleep 1
          done

          test "$V133_READY" = true
          echo '{"database":"ready","compatibility":"conditional"}'

          cleanup_v133
          trap - EXIT

  deposits-postgres-concurrency:
    name: D5 deposits PostgreSQL concurrency (zero skips)
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    # The suite refuses every hosted/private-network target. These constants
    # identify only this job's loopback-published PostgreSQL service, and the
    # live server address is independently attested against Docker metadata.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: luster_e2e_ci_disposable
          POSTGRES_USER: luster_e2e_ci
          POSTGRES_PASSWORD: luster-e2e-ci-only-password
        ports:
          - '127.0.0.1:55432:5432'
        options: >-
          --health-cmd "pg_isready -U luster_e2e_ci -d luster_e2e_ci_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://luster_e2e_ci:luster-e2e-ci-only-password@127.0.0.1:55432/luster_e2e_ci_disposable?application_name=luster-e2e-ci-disposable
      CONCURRENCY_TEST_DATABASE_URL: postgresql://luster_e2e_ci:luster-e2e-ci-only-password@127.0.0.1:55432/luster_e2e_ci_disposable?application_name=luster-e2e-ci-disposable
      LUSTER_DISPOSABLE_DATABASE: 'true'
      D5_CONCURRENCY_REQUIRED: 'true'
      D6_CONCURRENCY_REQUIRED: 'true'
      BILLING_PLAN_ENV: test
      CLERK_SECRET_KEY: ci-placeholder-not-a-secret
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2kubHVzdGVyLmludmFsaWQk
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      STRIPE_SECRET_KEY: ci-placeholder-not-a-secret
      STRIPE_WEBHOOK_SECRET: ci-placeholder-not-a-secret
      STRIPE_CONNECT_WEBHOOK_SECRET: ci-placeholder-not-a-secret
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ci-placeholder-not-a-secret

    steps:
      - uses: actions/checkout@v4
        with:
          # Exercise the reviewed PR commit, never GitHub's synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: HUSKY=0 npm ci

      - name: Prepare the guarded disposable PostgreSQL target
        run: npm run db:prepare:e2e:ci
        env:
          LUSTER_DISPOSABLE_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          LUSTER_DISPOSABLE_POSTGRES_NETWORK: ${{ job.services.postgres.network }}

      - name: Run all D5 real-PostgreSQL races and prove zero skips
        shell: bash
        env:
          LUSTER_DISPOSABLE_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          LUSTER_DISPOSABLE_POSTGRES_NETWORK: ${{ job.services.postgres.network }}
        run: |
          set -euo pipefail
          npm run test:deposits:pg | tee d5-postgres-concurrency.log
          grep -Fqx \
            'D5_REAL_POSTGRES_TESTS_EXECUTED=5 D5_REAL_POSTGRES_TESTS_SKIPPED=0' \
            d5-postgres-concurrency.log

      - name: Run all D6/D6.1 real-PostgreSQL money races and prove zero skips
        shell: bash
        env:
          LUSTER_DISPOSABLE_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          LUSTER_DISPOSABLE_POSTGRES_NETWORK: ${{ job.services.postgres.network }}
        run: |
          set -euo pipefail
          npx vitest run --no-file-parallelism \
            src/libs/deposits/depositRefund.concurrency.integration.test.ts \
            src/libs/queries.clientStats.concurrency.integration.test.ts \
            | tee d6-postgres-concurrency.log
          grep -Fqx \
            'D6_REAL_POSTGRES_TESTS_EXECUTED=10 D6_REAL_POSTGRES_TESTS_SKIPPED=0' \
            d6-postgres-concurrency.log
          grep -Fqx \
            'D6_1_CLIENT_STATS_POSTGRES_TESTS_EXECUTED=1 D6_1_CLIENT_STATS_POSTGRES_TESTS_SKIPPED=0' \
            d6-postgres-concurrency.log

