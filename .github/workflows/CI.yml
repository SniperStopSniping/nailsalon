          #    cannot smuggle an extra migration or an extra cron through.
          new_tags="$(git diff --unified=0 "$base" -- migrations/meta/_journal.json \
            | grep -E '^\+.*"tag"' | sed -E 's/.*"tag" *: *"([^"]+)".*/\1/' || true)"
          while read -r tag; do
