              0089_service_add_on_manual_confirmation) ;;
              0090_misty_sprite) ;;
              0091_appointment_add_on_service_snapshot) ;;
              0092_voice_receptionist) ;;
              0093_existing_test_client_text_defaults) ;;
              0094_billing_phone_identity) ;;
              0095_salon_chooser_visibility) ;;
              0096_rebooking_reminders) ;;
              0097_founding_lifetime_core) ;;
              0098_business_setup_drafts) ;;
