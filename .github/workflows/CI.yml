            if [ "$migration_0095_sql_sha256" != "e6eb382cde9368609b8ee41ae52208c05f21de71e8c273c96e50b9949320a79e" ] \
              || [ "$migration_0095_snapshot_sha256" != "bdb4de12b82dff7507bb6795c3f1fd9aeb8a8b7bb5a9f79a62337531e1792a6b" ]; then
