          expected_0095_journal='{"breakpoints":true,"idx":94,"tag":"0095_salon_chooser_visibility","version":"7","when":1790745061453}'
          actual_0095_journal="$(jq -cS '.entries[] | select(.tag == "0095_salon_chooser_visibility")' migrations/meta/_journal.json)"
          if [ "$actual_0095_journal" != "$expected_0095_journal" ]; then
