          actual_0097_journal="$(jq -cS '.entries[] | select(.tag == "0097_founding_lifetime_core")' migrations/meta/_journal.json)"
          if [ "$actual_0097_journal" != "$expected_0097_journal" ]; then
            echo "::error::Migration 0097 journal entry does not match the reviewed postimage."
            exit 1
          fi

          # AI setup SQL may be introduced only at these exact postimages.
          # Already-shipped SQL stays immutable, including additive rewrites.
          while read -r file expected_blob; do
            if ! git diff --quiet "$base" -- "$file"; then
              if git cat-file -e "$base:$file" 2>/dev/null \
                || [ "$(git diff --name-status "$base" -- "$file")" != $'A\t'"$file" ] \
                || [ "$(git hash-object "$file")" != "$expected_blob" ]; then
                echo "::error::AI setup migrations must be new files at the pinned postimages."
                exit 1
              fi
            fi
          done <<'AI_SETUP_MIGRATIONS'
          migrations/0098_business_setup_drafts.sql 95f1ebe6ce842d1834baedaba70f7733deed57ec
          migrations/0099_custom_frontend_sources.sql 13b73c00ae86594ae585922fdb967aed9583e08f
          migrations/0100_setup_ai_trial_evidence.sql 8f8346dbad47d8a2d940aa9e94773e01b1c1b3d7
          migrations/0101_setup_timestamp_instants.sql c1fd9b453b49a814ab8683bb4d1d9df772a18a02
          migrations/0102_custom_site_private_preview_images.sql e8a181f7f590b51c98b3b14bf896ee197bdd17d5
          migrations/0103_custom_site_asset_storage_choice.sql 2d9634222c474275a6e5c1f23e53da09bd1131dc
          migrations/0104_setup_upload_reviews.sql fc49a6d1425ddd9529eea23fabd7debfb3239dff
          migrations/0105_setup_ai_trial_cap_50.sql a33718ba4e450fc52ea6aa8a920834c2fee33d98
          migrations/0106_setup_shared_previews_cap_80.sql 194771119c8766649fb3a564d6d0540377a8afa8
          migrations/0107_ai_credit_wallet.sql 13880d46e7d80e563177b6956f9dba0f2be21eff
          migrations/0108_ai_request_metering.sql 9dc64ff20e3994236a174817fe6cdd6f19276ab1
          migrations/0109_setup_staff_publication.sql 620a8e4ef0cf4efb12c1e81af4d356191ee28cae
          migrations/0110_setup_add_on_publication.sql fa7b0b96f9475baea8b3d995048f0ab0464c61fb
          migrations/0111_other_service_categories.sql d53a465feb451bbd8279331796e102375b552726
          migrations/0112_ai_operator_expense_budget.sql eebc64176f6a19b50f4d232837588e1e2c1e5645
          AI_SETUP_MIGRATIONS

          if ! git diff --quiet "$base" -- migrations/meta/_journal.json; then
            # Shipped journal entries are IMMUTABLE, but later chartered
            # packets legitimately APPEND (0069/0070 below). A line-level or
            # blob pin cannot express that — appending an entry adds a comma
            # to the previous last entry — so immutability is enforced by
            # CONTENT: the shipped entry list must be a strict prefix of the
            # new one, and the journal header must be untouched. Step 6 then
            # bounds WHAT may be appended.
            base_entry_count="$(git show "$base:migrations/meta/_journal.json" | jq '.entries | length')"
            if ! diff \
              <(git show "$base:migrations/meta/_journal.json" | jq -S '.entries') \
              <(jq -S ".entries[:$base_entry_count]" migrations/meta/_journal.json) >/dev/null; then
              echo "::error::Shipped migration journal entries are immutable (append-only)."
              exit 1
            fi
            if [ "$(git show "$base:migrations/meta/_journal.json" | jq -cS 'del(.entries)')" \
              != "$(jq -cS 'del(.entries)' migrations/meta/_journal.json)" ]; then
              echo "::error::The migration journal header is immutable."
              exit 1
            fi
          fi

