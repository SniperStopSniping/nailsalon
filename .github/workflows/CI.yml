name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# PR numbers isolate agents; non-PR runs get unique groups, so main/release
# evidence is never cancelled by a later push or another PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    name: Secret hygiene
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Test secret scanner
        run: node --test scripts/check-secret-leaks.node-test.mjs

      - name: Scan tracked tree and reviewed commit range
        shell: bash
        env:
          SECRET_SCAN_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          SECRET_SCAN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          node scripts/check-secret-leaks.mjs
          --base "$SECRET_SCAN_BASE_SHA"
          --head "$SECRET_SCAN_HEAD_SHA"

  build:
    needs: secret-scan
    strategy:
      matrix:
        node-version: [20.x, 22.6] # Need to use 22.6 due to Next.js build errors: https://github.com/vercel/next.js/issues/69263
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    name: Build with ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    env:
      BILLING_PLAN_ENV: test
      CLERK_SECRET_KEY: ci-placeholder-not-a-secret
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2kubHVzdGVyLmludmFsaWQk
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      STRIPE_SECRET_KEY: ci-placeholder-not-a-secret
      STRIPE_WEBHOOK_SECRET: ci-placeholder-not-a-secret
      STRIPE_CONNECT_WEBHOOK_SECRET: ci-placeholder-not-a-secret
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ci-placeholder-not-a-secret

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Scan production client bundles and runtime credentials
        run: npm run security:check-secrets -- --tree

  full-vitest-shards:
    name: Vitest shard ${{ matrix.shard }}/3
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    needs: secret-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # Required merge evidence must exercise the reviewed PR commit,
          # never GitHub's synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: HUSKY=0 npm ci

      - name: Run full Vitest suite
        run: npm run test:all -- --shard=${{ matrix.shard }}/3

  full-vitest:
    name: Full Vitest Suite
    needs: full-vitest-shards
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every Vitest shard
        env:
          SHARDS_RESULT: ${{ needs.full-vitest-shards.result }}
        run: test "$SHARDS_RESULT" = success

  test-core:
    needs: secret-scan
    strategy:
      matrix:
        node-version: [20.x]

    name: Application tests
    runs-on: ubuntu-latest
    # Every other long-running job here is bounded (15-25m). This one was not,
    # so it inherited GitHub's 6-hour default. When the Playwright install step
    # below stalled on main, the job sat for 5h54m before that default killed
    # it, which cancelled the whole CI run -- and because Release gates on
    # `workflow_run.conclusion == 'success'`, a cancelled CI silently skipped
    # the release. Generous versus the ~12m this job actually takes, because
    # the point is to bound a hang, not to police normal variance.
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: luster_e2e_ci_disposable
          POSTGRES_USER: luster_e2e_ci
          POSTGRES_PASSWORD: luster-e2e-ci-only-password
        ports:
          - '127.0.0.1:55432:5432'
        options: >-
          --health-cmd "pg_isready -U luster_e2e_ci -d luster_e2e_ci_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - '127.0.0.1:6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgresql://luster_e2e_ci:luster-e2e-ci-only-password@127.0.0.1:55432/luster_e2e_ci_disposable?application_name=luster-e2e-ci-disposable
      LUSTER_DISPOSABLE_DATABASE: 'true'
      BILLING_PLAN_ENV: test
      CLERK_SECRET_KEY: ci-placeholder-not-a-secret
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2kubHVzdGVyLmludmFsaWQk
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      STRIPE_SECRET_KEY: ci-placeholder-not-a-secret
      STRIPE_WEBHOOK_SECRET: ci-placeholder-not-a-secret
      STRIPE_CONNECT_WEBHOOK_SECRET: ci-placeholder-not-a-secret
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ci-placeholder-not-a-secret
      SUPER_ADMIN_AUTH_MODE: password
      SUPER_ADMIN_TEST_LOGIN_ENABLED: 'true'
      ALLOW_STAGING_SUPER_ADMIN_PASSWORD: 'true'
      LEGACY_OTP_AUTH_ENABLED: 'false'
      E2E_USE_REAL_TWILIO: 'false'
      TWILIO_ACCOUNT_SID: ''
      TWILIO_AUTH_TOKEN: ''
      TWILIO_VERIFY_SERVICE_SID: ''
      TWILIO_PHONE_NUMBER: ''
      RESEND_API_KEY: ''
      RESEND_FROM_EMAIL: ''
      RESEND_REPLY_TO_EMAIL: ''

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # Retrieve Git history, needed to verify commits
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Test CI evidence and cancellation contracts
        run: node --test scripts/ci-workflow.node-test.mjs

      # The deposits ladder is additive by construction. These paths carry the
      # SaaS billing surface, dependency manifests, migration set, deploy
      # manifest, and salon-purge coverage contract.
      #
      # The billing webhook route and SaaS billing surface are pinned to a hard
      # ZERO DIFF. Dependency security upgrades require exact reviewed pairs.
      # D6's salon-purge extension is separately pinned to an exact additive
      # postimage: its reviewed registration and preflight may be added, while
      # no existing line may be removed or rewritten.
      #
      # The other two — `migrations` and `vercel.json` — cannot be zero-diff,
      # because the ladder is *defined* by packets that ship schema and crons:
      # D1 landed 0065 before this step existed, and D4 ships 0066 plus the
      # hold-reaper cron, both named in its frozen manifest. Pinning them to
      # zero would make the guard contradict the charters it exists to protect.
      # They are therefore held to an ADDITIVE ALLOWLIST, which is strictly
      # stronger than "unpinned" and still catches the drift the original step
      # was written to catch:
      #   * only chartered paths may change at all — any other migration file,
      #     or any other file under `migrations/`, still fails;
      #   * nothing may be DELETED or REWRITTEN — an edit to an already-shipped
      #     migration, or to an existing cron entry, still fails;
      #   * the only new journal tag and the only new cron path permitted are
      #     the ones the owning packet is chartered to add.
      # A later packet EXTENDS the two allowlists below; it does not remove the
      # check.
      #
      # This step lives in the `test` job because only its checkout sets
      # `fetch-depth: 0` — the shallow checkouts elsewhere cannot resolve
      # `git merge-base`.
      - name: Deposits ladder protected surfaces
        shell: bash
        run: |
          set -euo pipefail
          base="$(git merge-base origin/main HEAD)"

          # 1. Hard zero-diff. D6 adds dependency manifests to the protected set.
          #    Gate C2 narrowed the billing freeze: the checkout surface moved
          #    to the reviewed-postimage allowlist in step 1b — its legacy body
          #    accepted a client-supplied Stripe priceId and was replaced by
          #    the server-authoritative C2 route. P5b (G41, D18, explicit
          #    owner approval 2026-09-14) moved the Billing Portal route the
          #    same way: it also stays a LIVE, production-used surface, but
          #    now via the reviewed-postimage gate below (not a zero-diff
          #    line) so it can resolve new-track `billing_subscription`
          #    customers instead of only the legacy `salon.stripeCustomerId`
          #    column. D19c (owner ratification 2026-09-16, Rev 2.3 §5) moves
          #    the legacy webhook route the same way. That route stays frozen
          #    except for the single §5 isolation exception: it must not
          #    project a new-track Checkout Session or Subscription onto a
          #    salon row. Every object matching neither guard is processed
          #    byte-identically, so only a REVIEWED postimage is accepted here.
          if ! git diff --quiet "$base" -- src/app/api/webhooks/stripe/route.ts; then
            legacy_webhook_blob="$(git hash-object src/app/api/webhooks/stripe/route.ts)"
            case "$legacy_webhook_blob" in
              # D19c: Guard A (metadata.purpose) + Guard B (billing_subscription
              # local-ownership backstop) and nothing else.
              85990776e5a63a04397c6958092be0ec660f109c) ;;
              *)
                echo "::error::src/app/api/webhooks/stripe/route.ts must match a reviewed postimage."
                printf 'actual blob: %s\n' "$legacy_webhook_blob"
                exit 1
                ;;
            esac
          fi

          # Dependency manifests remain frozen except these reviewed exact
          # manifest/lock pairs. Neither a generic version range nor an
          # unrelated dependency refresh can ride along with a security fix.
          if ! git diff --quiet "$base" -- package.json package-lock.json; then
            dependency_manifest_blob="$(git hash-object package.json)"
            dependency_lock_blob="$(git hash-object package-lock.json)"
            case "$dependency_manifest_blob:$dependency_lock_blob" in
              # Clerk 6.39.6: GHSA-vqx2-fgx2-5wq9 + GHSA-w24r-5266-9c3c.
              158fcdce964972ec67f578e56bddba4db1408596:94fa39b23421c3eafeeddff7aac5fe50d6e71fa8) ;;
              # Next 15.5.25 / React 19.2.8: patched App Router request handling
              # (GHSA-m99w-x7hq-7vfj), with compatible intl/UI/test dependencies.
              2566f6f2a1cb093ce512627a1568265c57aa8895:8d44f4449583e8d5d8bcc3cf6e844d9f47610578) ;;
              *)
                echo "::error::Dependency manifests must match a reviewed security-refresh pair."
                printf 'actual blobs: %s:%s\n' "$dependency_manifest_blob" "$dependency_lock_blob"
                exit 1
                ;;
            esac
          fi

          # 1b. Billing checkout surface (Gate C2). Only the enumerated paths
          #     may change under src/app/api/billing, and the route itself
          #     must match a reviewed postimage. Extend this list per reviewed
          #     change; never remove entries — historical freezes stay frozen.
          while read -r file; do
            [ -n "$file" ] || continue
            case "$file" in
              src/app/api/billing/checkout/route.ts) ;;
              src/app/api/billing/checkout/route.test.ts) ;;
              src/app/api/billing/windows/evaluate/route.ts) ;;
              src/app/api/billing/windows/evaluate/route.test.ts) ;;
              src/app/api/billing/reconcile/route.ts) ;;
              src/app/api/billing/reconcile/route.test.ts) ;;
              src/app/api/billing/checkout/topup/route.ts) ;;
              src/app/api/billing/checkout/topup/route.concurrency.integration.test.ts) ;;
              src/app/api/billing/checkout/topup/route.test.ts) ;;
              # P5a (G17): top-up purchase history, dark-gated + tenant-scoped.
              src/app/api/billing/topups/route.ts) ;;
              src/app/api/billing/topups/route.test.ts) ;;
              # P5b (G41, D18): Billing Portal customer resolution.
              src/app/api/billing/portal/route.ts) ;;
              src/app/api/billing/portal/route.test.ts) ;;
              # PR-4 (handoff §5.3): CRON_SECRET-authorized deployed readiness
              # evidence. Read-only, presence booleans only, no Stripe/DB call.
              src/app/api/billing/readiness/route.ts) ;;
              src/app/api/billing/readiness/route.test.ts) ;;
              *)
                echo "::error::Unauthorized change under src/app/api/billing: $file"
                exit 1
                ;;
            esac
          done <<< "$(git diff --name-only "$base" -- src/app/api/billing)"
          if ! git diff --quiet "$base" -- src/app/api/billing/checkout/route.ts; then
            checkout_blob="$(git hash-object src/app/api/billing/checkout/route.ts)"
            case "$checkout_blob" in
              # Reviewed postimages: Gate C2 server-authoritative checkout.
              ce148781b0f8b28aa2b94f9f623b06869871337f) ;;
              # + §2.3 typed duplicate-subscription refusals.
              90b8019c1d545de917763ffb9d983f6eb5f04edd) ;;
              # + P6 automatic-tax architecture (collection dark).
              7499a6d0a128b47971927f796e68f13b1888885d) ;;
              # + P3c checkout_session_created audit (§8.5).
              d4ffdac927b223234cf3292a83c2be4974b0cf91) ;;
              # + PR-B (owner approval 2026-09-16, O7/O10): requireAdminOwner,
              # per-reason attempt-conflict responses (CHECKOUT_IN_PROGRESS no
              # longer reported as ACTIVE_SUBSCRIPTION_EXISTS), and the X5
              # redirect origin resolved before TX1.
              a7a2e3cf55225ff923950fbbb2f59e7bda099ae2) ;;
              # + PR-C canonical billing_customer identity, deployment-marker
              # stamping on Session + Subscription, and no customer_email.
              # Independent payment-safety review 2026-09-17.
              c2416168241fce84b8fa556cd5aded8204afa92a) ;;
              *)
                echo "::error::src/app/api/billing/checkout/route.ts must match a reviewed postimage."
                printf 'actual blob: %s\n' "$checkout_blob"
                exit 1
                ;;
            esac
          fi

          # Reviewed postimages: P5b billing_subscription customer resolution + masked errors (D18, 2026-09-14).
          if ! git diff --quiet "$base" -- src/app/api/billing/portal/route.ts; then
            portal_blob="$(git hash-object src/app/api/billing/portal/route.ts)"
            case "$portal_blob" in
              a4e92403b3a77bb60a414ce91651fd8de7137ad0) ;;
              # + PR-B (owner approval 2026-09-16, O7/O10): requireAdminOwner,
              # the X5 return_url origin via resolveBillingAppOrigin(), and
              # same-origin validation of the caller-supplied returnUrl.
              9773fc739f9c251c77370d4902997fbc175a8558) ;;
              # + PR-C canonical billing_customer resolution/adoption before
              # the sanctioned genuine-legacy Portal fallback.
              # Independent payment-safety review 2026-09-17.
              0980ab2978ef54cc868247d0d9354cc3692172b7) ;;
              *)
                echo "::error::src/app/api/billing/portal/route.ts must match a reviewed postimage."
                printf 'actual blob: %s\n' "$portal_blob"
                exit 1
                ;;
            esac
          fi

          # 2. D6's salon-purge edit is additive and byte-exact. The postimage
          #    contains only the appointment_deposit registration, the two
          #    named unsettled predicates, and the common purge preflight.
          if ! git diff --quiet "$base" -- src/libs/salonPurge.ts; then
            salon_purge_removed="$(git diff --unified=0 "$base" -- src/libs/salonPurge.ts \
              | grep -E '^-' | grep -vE '^--- ' || true)"
            if [ -n "$salon_purge_removed" ]; then
              echo "::error::The D6 salon-purge allowlist is additive; existing lines may not be removed or rewritten."
              printf '%s\n' "$salon_purge_removed"
              exit 1
            fi

            salon_purge_blob="$(git hash-object src/libs/salonPurge.ts)"
            case "$salon_purge_blob" in
              # Reviewed postimages: D6 baseline, then Gate B1 (billing purge
              # steps). Extend this list per reviewed change; never remove.
              ba5eaf44ce96b6f217d94c71268d8261bc5bfe24) ;;
              f75af0c6fa6d6be326ffb6f1272c51ea7fa2f1fe) ;;
              e423780a1d92122518864f20b801b0302bdb42a6) ;;
              # Discover PR1: registers salon_portfolio_photo and
              # salon_discover_settings purge steps, the cross-tenant
              # technician-reference check, and the technician null-out.
              # Strictly additive over the Gate B1 postimage above.
              a9bee33c090b68feb4b8f3c9c351bc2bf7040b56) ;;
              # Account-backed onboarding: tenant-scoped draft claim, media,
              # revision and site cleanup, in child-before-parent order.
              # Strictly additive over the Discover PR1 postimage above.
              e62b6f637ee0c90f995657c15dd7ea4138bc102f) ;;
              # Review requests: add the tenant-scoped review_request purge step.
              3c824ab5a65b2376af76d105f9fb5f555b22b1ff) ;;
              # Review-automation trigger contract: purge review_request before
              # its NO ACTION trigger reference, then remove the trigger row.
              27fd38cdd3e1ae7dbb0b5ec5f4180febb6a50584) ;;
              *)
                echo "::error::Unauthorized change outside the reviewed salon-purge postimages."
                printf 'actual blob: %s\n' "$salon_purge_blob"
                exit 1
                ;;
            esac
          fi

          # 3. Only the current packet's chartered paths may change under the
          #    additive surfaces. Previously shipped migrations are deliberately
          #    absent: any later edit to 0066 or 0067 must fail.
          while read -r file; do
            [ -n "$file" ] || continue
            case "$file" in
              migrations/0068_deposit_credit_tax_snapshots.sql) ;;
              migrations/0069_billing_credit_foundation.sql) ;;
              migrations/0070_communications_pipeline.sql) ;;
              # Discover PR1 — portfolio foundation (docs/DISCOVER_V1_BRIEF.md).
              migrations/0071_discover_portfolio_foundation.sql) ;;
              # Luster L1 PR1 — dark catalog foundation.
              migrations/0072_l1_catalog_foundation.sql) ;;
              # Luster L1 PR2 — dark catalog grouping / capability / rule
              # foundation.
              migrations/0073_l1_catalog_rules_foundation.sql) ;;
              # Account-backed onboarding — canonical saved site foundation.
              migrations/0074_onboarding_account_site_foundation.sql) ;;
              # Quick Book design system — widens the onboarding media role
              # list to include `cover`. Additive constraint change only.
              migrations/0075_onboarding_cover_media_role.sql) ;;
              # D6-R1 immutable, SQL-only deposit evidence prerequisite.
              migrations/0076_deposit_shadow_evidence.sql) ;;
              # One-time review requests, disabled by default and without backfill.
              migrations/0077_review_requests.sql) ;;
              # New-track Stripe customer identity: one durable customer per
              # (salon, plan env). Additive, inert, no backfill.
              migrations/0079_billing_customer.sql) ;;
              # Dark customer booking operation; no billing or appointment rewrites.
              migrations/0080_customer_booking_operation.sql) ;;
              # Inert review-automation policy and durable trigger contract;
              # no appointment scan, delivery, or activation behavior.
              migrations/0081_review_request_automation_contract.sql) ;;
              # Reviewed nullable review contract, retaining lifetime indexes.
              migrations/0082_review_request_nullable_contract.sql) ;;
              # Reviewed manual admission and coordinated repeat-policy migrations.
              migrations/0083_review_request_manual_contract.sql) ;;
              migrations/0084_review_request_repeat_cooldown.sql) ;;
              # Reviewed intraday calendar blocks and per-technician write guard.
              migrations/0085_calendar_intraday_blocks.sql) ;;
              migrations/meta/0079_snapshot.json) ;;
              migrations/meta/0081_snapshot.json) ;;
              migrations/meta/0082_snapshot.json) ;;
              migrations/meta/0083_snapshot.json) ;;
              migrations/meta/0084_snapshot.json) ;;
              migrations/meta/0085_snapshot.json) ;;
              migrations/meta/_journal.json) ;;
              vercel.json) ;;
              *)
                echo "::error::Unauthorized change to a protected ladder surface: $file"
                exit 1
                ;;
            esac
          done <<< "$(git diff --name-only "$base" -- migrations vercel.json)"

          # 4. Additive by construction: no deletions, no rewrites. This is what
          #    keeps an already-shipped migration or an existing cron immutable.
          removed="$(git diff --unified=0 "$base" -- migrations vercel.json \
            | grep -E '^-' | grep -vE '^--- ' || true)"
          if [ -n "$removed" ]; then
            echo "::error::The deposits ladder is additive by construction, but these lines were removed or rewritten:"
            printf '%s\n' "$removed"
            exit 1
          fi

          # 5. D6.1 may add 0068 exactly once and only with its reviewed
          #    postimage. Once origin/main contains it, every subsequent edit is
          #    rejected even if the edit is additive. The journal follows the
          #    same one-packet rule, preventing additive mutation of old entries.
          if ! git diff --quiet "$base" -- migrations/0068_deposit_credit_tax_snapshots.sql; then
            if git cat-file -e "$base:migrations/0068_deposit_credit_tax_snapshots.sql" 2>/dev/null; then
              echo "::error::Migration 0068 is already shipped and is immutable."
              exit 1
            fi
            migration_0068_status="$(git diff --name-status "$base" -- migrations/0068_deposit_credit_tax_snapshots.sql)"
            if [ "$migration_0068_status" != $'A\tmigrations/0068_deposit_credit_tax_snapshots.sql' ]; then
              echo "::error::Migration 0068 must be introduced as one new file."
              printf 'actual status: %s\n' "$migration_0068_status"
              exit 1
            fi
            migration_0068_blob="$(git hash-object migrations/0068_deposit_credit_tax_snapshots.sql)"
            if [ "$migration_0068_blob" != "ea99188b3e4a55730ee10f372b731ddfc1930124" ]; then
              echo "::error::Migration 0068 does not match the reviewed D6.1 postimage."
              printf 'actual blob: %s\n' "$migration_0068_blob"
              exit 1
            fi
          fi

          # The Stripe D6-R1 prerequisite is a reviewed immutable SQL packet.
          # Review Requests follows it as 0077; changing this SQL would corrupt
          # an already-recorded migration identity on Stripe's ledger.
          if ! git diff --quiet "$base" -- migrations/0076_deposit_shadow_evidence.sql; then
            if git cat-file -e "$base:migrations/0076_deposit_shadow_evidence.sql" 2>/dev/null; then
              echo "::error::Migration 0076 is already shipped and is immutable."
              exit 1
            fi
            migration_0076_status="$(git diff --name-status "$base" -- migrations/0076_deposit_shadow_evidence.sql)"
            if [ "$migration_0076_status" != $'A\tmigrations/0076_deposit_shadow_evidence.sql' ]; then
              echo "::error::Migration 0076 must be introduced as one new file."
              printf 'actual status: %s\n' "$migration_0076_status"
              exit 1
            fi
            migration_0076_sha256="$(sha256sum migrations/0076_deposit_shadow_evidence.sql | awk '{print $1}')"
            if [ "$migration_0076_sha256" != "3626d5427a18d1762ae6e4807cb9a31f8dc093c22cc700b7a6a712a4945f1765" ]; then
              echo "::error::Migration 0076 does not match the reviewed Stripe D6-R1 postimage."
              printf 'actual SHA256: %s\n' "$migration_0076_sha256"
              exit 1
            fi
          fi

          # 0085 is a reviewed two-artifact migration packet. It may be
          # introduced once, with these exact SQL and snapshot postimages; once
          # main contains either artifact, both are immutable.
          if ! git diff --quiet "$base" -- migrations/0085_calendar_intraday_blocks.sql migrations/meta/0085_snapshot.json; then
            if git cat-file -e "$base:migrations/0085_calendar_intraday_blocks.sql" 2>/dev/null \
              || git cat-file -e "$base:migrations/meta/0085_snapshot.json" 2>/dev/null; then
              echo "::error::Migration 0085 and its snapshot are already shipped and immutable."
              exit 1
            fi
            migration_0085_sql_status="$(git diff --name-status "$base" -- migrations/0085_calendar_intraday_blocks.sql)"
            migration_0085_snapshot_status="$(git diff --name-status "$base" -- migrations/meta/0085_snapshot.json)"
            if [ "$migration_0085_sql_status" != $'A\tmigrations/0085_calendar_intraday_blocks.sql' ] \
              || [ "$migration_0085_snapshot_status" != $'A\tmigrations/meta/0085_snapshot.json' ]; then
              echo "::error::Migration 0085 must introduce exactly one SQL file and one snapshot."
              printf 'SQL status: %s\nSnapshot status: %s\n' "$migration_0085_sql_status" "$migration_0085_snapshot_status"
              exit 1
            fi
            migration_0085_sql_sha256="$(sha256sum migrations/0085_calendar_intraday_blocks.sql | awk '{print $1}')"
            migration_0085_snapshot_sha256="$(sha256sum migrations/meta/0085_snapshot.json | awk '{print $1}')"
            if [ "$migration_0085_sql_sha256" != "3f6eecda4b285df784027cddd2b92ba46207503ff446f19457378bf8a9549e86" ] \
              || [ "$migration_0085_snapshot_sha256" != "dcf01f06a74a13e3499d93aa392a5e7d3e9f869c3d6343e86e0cf8bcdec9a7da" ]; then
              echo "::error::Migration 0085 artifacts do not match the reviewed intraday-block postimage."
              printf 'SQL SHA256: %s\nSnapshot SHA256: %s\n' "$migration_0085_sql_sha256" "$migration_0085_snapshot_sha256"
              exit 1
            fi
          fi

          # Check even on journal-only changes: missing or duplicate 0085 entries
          # must never pass the general append-only tag allowlist.
          expected_0085_journal='{"breakpoints":true,"idx":84,"tag":"0085_calendar_intraday_blocks","version":"7","when":1789847765426}'
          actual_0085_journal="$(jq -cS '.entries[] | select(.tag == "0085_calendar_intraday_blocks")' migrations/meta/_journal.json)"
          if [ "$actual_0085_journal" != "$expected_0085_journal" ]; then
            echo "::error::Migration 0085 journal entry does not match the reviewed postimage."
            exit 1
          fi

          if ! git diff --quiet "$base" -- migrations/meta/_journal.json; then
            # Shipped journal entries are IMMUTABLE, but later chartered
            # packets legitimately APPEND (0069/0070 below). A line-level or
            # blob pin cannot express that — appending an entry adds a comma
            # to the previous last entry — so immutability is enforced by
            # CONTENT: the shipped entry list must be a strict prefix of the
            # new one, and the journal header must be untouched. Step 6 then
            # bounds WHAT may be appended.
            base_entry_count="$(git show "$base:migrations/meta/_journal.json" | jq '.entries | length')"
            if ! diff \
              <(git show "$base:migrations/meta/_journal.json" | jq -S '.entries') \
              <(jq -S ".entries[:$base_entry_count]" migrations/meta/_journal.json) >/dev/null; then
              echo "::error::Shipped migration journal entries are immutable (append-only)."
              exit 1
            fi
            if [ "$(git show "$base:migrations/meta/_journal.json" | jq -cS 'del(.entries)')" \
              != "$(jq -cS 'del(.entries)' migrations/meta/_journal.json)" ]; then
              echo "::error::The migration journal header is immutable."
              exit 1
            fi
          fi

          # 6. The additions themselves are allowlisted by content, so a packet
          #    cannot smuggle an extra migration or an extra cron through.
          new_tags="$(git diff --unified=0 "$base" -- migrations/meta/_journal.json \
            | grep -E '^\+.*"tag"' | sed -E 's/.*"tag" *: *"([^"]+)".*/\1/' || true)"
          while read -r tag; do
            [ -n "$tag" ] || continue
            case "$tag" in
              0068_deposit_credit_tax_snapshots) ;;
              0069_billing_credit_foundation) ;;
              0070_communications_pipeline) ;;
              # Discover PR1 — portfolio foundation (docs/DISCOVER_V1_BRIEF.md).
              0071_discover_portfolio_foundation) ;;
              # Luster L1 PR1 — dark catalog foundation.
              0072_l1_catalog_foundation) ;;
              # Luster L1 PR2 — dark catalog grouping / capability / rule
              # foundation.
              0073_l1_catalog_rules_foundation) ;;
              0074_onboarding_account_site_foundation) ;;
              # Quick Book design system — onboarding cover media role.
              0075_onboarding_cover_media_role) ;;
              0076_deposit_shadow_evidence) ;;
              0077_review_requests) ;;
              # New-track Stripe customer identity (billing_customer).
              0079_billing_customer) ;;
              0080_customer_booking_operation) ;;
              # Inert review-automation policy and durable trigger contract.
              0081_review_request_automation_contract) ;;
              0082_review_request_nullable_contract) ;;
              0083_review_request_manual_contract) ;;
              0084_review_request_repeat_cooldown) ;;
              0085_calendar_intraday_blocks) ;;
              *)
                echo "::error::Unauthorized migration journal entries: $tag"
                exit 1
                ;;
            esac
          done <<< "$new_tags"

          # Compared PER ENTRY against the chartered set, not as one joined
          # string: a packet that legitimately adds a cron alongside an earlier
          # one would otherwise fail on the concatenation rather than on its
          # content. The guard is unchanged in strength — anything not named
          # here still fails.
          new_crons="$(git diff --unified=0 "$base" -- vercel.json \
            | grep -E '^\+.*"path"' | sed -E 's/.*"path" *: *"([^"]+)".*/\1/' || true)"
          while read -r cron; do
            [ -n "$cron" ] || continue
            case "$cron" in
              /api/deposits/holds/reap) ;;
              /api/deposits/reconcile) ;;
              /api/communications/dispatch) ;;
              # D3 (2026-09-14): billing crons, dark until BILLING_* switches flip
              /api/billing/windows/evaluate) ;;
              /api/billing/reconcile) ;;
              *)
                echo "::error::Unauthorized vercel.json cron entry: $cron"
                exit 1
                ;;
            esac
          done <<< "$new_crons"

      - name: Create ephemeral synthetic E2E admin credentials
        shell: bash
        run: |
          SYNTHETIC_PHONE="$(printf '%s%s%s' '999' '555' '0150')"
          SYNTHETIC_PASSWORD="ci-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}${RANDOM}"
          SYNTHETIC_CRON_SECRET="ci-review-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}${RANDOM}"
          echo "::add-mask::${SYNTHETIC_PASSWORD}"
          echo "::add-mask::${SYNTHETIC_CRON_SECRET}"
          {
            echo "E2E_SUPER_ADMIN_PHONE=${SYNTHETIC_PHONE}"
            echo "E2E_SUPER_ADMIN_PASSWORD=${SYNTHETIC_PASSWORD}"
            echo "CRON_SECRET=${SYNTHETIC_CRON_SECRET}"
          } >> "$GITHUB_ENV"

      - name: Test disposable database target guard
        run: npm run test:disposable-database-target

      # Static URL checks, Docker service identity checks, and live PostgreSQL
      # session attestation all complete before migrations or synthetic seeding.
      - name: Prepare disposable PostgreSQL for E2E
        run: npm run db:prepare:e2e:ci
        env:
          LUSTER_DISPOSABLE_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          LUSTER_DISPOSABLE_POSTGRES_NETWORK: ${{ job.services.postgres.network }}

      - name: Prove synthetic E2E fixture seeding is idempotent
        run: npm run db:seed:e2e
        env:
          LUSTER_DISPOSABLE_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          LUSTER_DISPOSABLE_POSTGRES_NETWORK: ${{ job.services.postgres.network }}

      # This suite is intentionally explicit. The default unit-test command
      # selects tests from the changed-file graph, so appointment behavior
      # could otherwise disappear from an unrelated release without running
      # the regression coverage that protects the mobile sheet.
      - name: Appointment sheet regression gate
        run: npm run test:appointment-regression

      - name: Build Next.js for E2E tests
        run: npm run build
        # PR-controlled builds validate the production bundle without provider
        # upload credentials. Trusted deployment remains responsible for Sentry
        # source-map upload coverage.

      - if: github.event_name == 'pull_request'
        name: Validate all commits from PR
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Linter
        run: npm run lint

      - name: Scan built client assets and runtime credentials
        run: npm run security:check-secrets -- --tree

      - name: Type checking
        run: npm run check-types

      - name: Run unit tests
        run: npm run test -- --coverage

      # Coverage is still collected on PRs. Only trusted main executes the
      # provider upload step with its repository credential.
      - name: Upload coverage reports to Codecov from trusted main
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Install Playwright safely
        timeout-minutes: 38
        uses: ./.github/actions/install-playwright

      # Functional visual assertions remain in Visual.e2e.ts for PRs, while
      # trusted main retains hosted snapshot publication.
      - name: Run E2E tests against disposable PostgreSQL
        if: github.event_name == 'pull_request'
        env:
          LUSTER_DISPOSABLE_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          LUSTER_DISPOSABLE_POSTGRES_NETWORK: ${{ job.services.postgres.network }}
        run: npm run test:e2e -- tests/e2e/mobile-staff-uiqi.e2e.ts tests/e2e/booking-layout-variants.e2e.ts tests/e2e/account-gate-contrast.e2e.ts tests/e2e/booking-page-hub.e2e.ts tests/e2e/review-requests.e2e.ts

      - name: Verify authoritative L1 public booking in mobile Chromium and WebKit
        env:
          CONCURRENCY_TEST_DATABASE_URL: postgresql://luster_e2e_ci:luster-e2e-ci-only-password@127.0.0.1:55432/luster_e2e_ci_disposable?application_name=luster-e2e-ci-disposable
          LUSTER_DISPOSABLE_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          LUSTER_DISPOSABLE_POSTGRES_NETWORK: ${{ job.services.postgres.network }}
          NEXT_PUBLIC_APP_URL: http://localhost:3101
          APP_URL: http://localhost:3101
        run: npx playwright test --config tests/browser/l1-public-booking/playwright.config.ts

      - name: Run E2E with trusted-main Percy coverage
        if: github.event_name == 'push'
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          LUSTER_DISPOSABLE_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          LUSTER_DISPOSABLE_POSTGRES_NETWORK: ${{ job.services.postgres.network }}
        run: |
          if [ -n "$PERCY_TOKEN" ]; then
            npx percy exec -- npm run test:e2e -- tests/e2e/mobile-staff-uiqi.e2e.ts tests/e2e/booking-layout-variants.e2e.ts tests/e2e/account-gate-contrast.e2e.ts tests/e2e/booking-page-hub.e2e.ts tests/e2e/review-requests.e2e.ts
          else
            npm run test:e2e -- tests/e2e/mobile-staff-uiqi.e2e.ts tests/e2e/booking-layout-variants.e2e.ts tests/e2e/account-gate-contrast.e2e.ts tests/e2e/booking-page-hub.e2e.ts tests/e2e/review-requests.e2e.ts
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  test-components:
