      # session attestation all complete before migrations or synthetic seeding.
      - name: Prepare disposable PostgreSQL for E2E
        run: npm run db:prepare:e2e:ci
        env:
          LUSTER_DISPOSABLE_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          LUSTER_DISPOSABLE_POSTGRES_NETWORK: ${{ job.services.postgres.network }}

      - name: Prove synthetic E2E fixture seeding is idempotent
        run: npm run db:seed:e2e
        env:
          LUSTER_DISPOSABLE_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          LUSTER_DISPOSABLE_POSTGRES_NETWORK: ${{ job.services.postgres.network }}

      # This suite is intentionally explicit. The default unit-test command
      # selects tests from the changed-file graph, so appointment behavior
      # could otherwise disappear from an unrelated release without running
      # the regression coverage that protects the mobile sheet.
      - name: Appointment sheet regression gate
        run: npm run test:appointment-regression

      - name: Check all TypeScript diagnostics before framework build
        run: npm run check-types

      - name: Build Next.js for E2E tests
        run: npm run build
        # PR-controlled builds validate the production bundle without provider
        # upload credentials. Trusted deployment remains responsible for Sentry
        # source-map upload coverage.

      - if: github.event_name == 'pull_request'
        name: Validate commits introduced by the PR
        env:
          PR_BASE_BRANCH: ${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          node scripts/validate-pr-commits.mjs
          --base-branch "$PR_BASE_BRANCH"
          --head "$PR_HEAD_SHA"

      - name: Linter
        run: npm run lint

      - name: Scan built client assets and runtime credentials
        run: npm run security:check-secrets -- --tree

      - name: Type checking
        run: npm run check-types

      - name: Run unit tests
        run: npm run test -- --coverage

      - name: Verify prepaid AI wallet concurrency on disposable PostgreSQL
        env:
          CONCURRENCY_TEST_DATABASE_URL: postgresql://luster_e2e_ci:luster-e2e-ci-only-password@127.0.0.1:55432/luster_e2e_ci_disposable?application_name=luster-e2e-ci-disposable
          LUSTER_DISPOSABLE_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          LUSTER_DISPOSABLE_POSTGRES_NETWORK: ${{ job.services.postgres.network }}
          AI_CREDIT_CONCURRENCY_REQUIRED: 'true'
        run: |
          set -euo pipefail
          npx vitest run --no-file-parallelism src/features/ai-credits/wallet.concurrency.integration.test.ts --reporter=json --outputFile=ai-credit-concurrency.json
          node -e 'const r=require("./ai-credit-concurrency.json"); if(!r.success || r.numPassedTests!==9 || r.numTotalTests!==9 || r.numPendingTests!==0) process.exit(1)'

      - name: Verify AI owner entry concurrency on disposable PostgreSQL
        env:
          CONCURRENCY_TEST_DATABASE_URL: postgresql://luster_e2e_ci:luster-e2e-ci-only-password@127.0.0.1:55432/luster_e2e_ci_disposable?application_name=luster-e2e-ci-disposable
          LUSTER_DISPOSABLE_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          LUSTER_DISPOSABLE_POSTGRES_NETWORK: ${{ job.services.postgres.network }}
          AI_ENTRY_CONCURRENCY_REQUIRED: 'true'
        run: |
          set -euo pipefail
          npx vitest run --no-file-parallelism src/features/business-setup/entry.concurrency.integration.test.ts --reporter=json --outputFile=ai-entry-concurrency.json
          node -e 'const r=require("./ai-entry-concurrency.json"); if(!r.success || r.numPassedTests!==2 || r.numTotalTests!==2 || r.numPendingTests!==0) process.exit(1)'

      - name: Verify AI setup publication concurrency on disposable PostgreSQL
        env:
          CONCURRENCY_TEST_DATABASE_URL: postgresql://luster_e2e_ci:luster-e2e-ci-only-password@127.0.0.1:55432/luster_e2e_ci_disposable?application_name=luster-e2e-ci-disposable
          LUSTER_DISPOSABLE_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          LUSTER_DISPOSABLE_POSTGRES_NETWORK: ${{ job.services.postgres.network }}
          AI_SETUP_PUBLICATION_CONCURRENCY_REQUIRED: 'true'
        run: |
          set -euo pipefail
          npx vitest run --no-file-parallelism src/features/business-setup/publication.concurrency.integration.test.ts --reporter=json --outputFile=ai-publication-concurrency.json
          node -e 'const r=require("./ai-publication-concurrency.json"); if(!r.success || r.numPassedTests!==13 || r.numTotalTests!==13 || r.numPendingTests!==0) process.exit(1)'

      # Coverage is still collected on PRs. Only trusted main executes the
      # provider upload step with its repository credential.
      - name: Upload coverage reports to Codecov from trusted main
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

