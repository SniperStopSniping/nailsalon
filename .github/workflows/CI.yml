            case "$tag" in
              0068_deposit_credit_tax_snapshots) ;;
              0069_billing_credit_foundation) ;;
              0070_communications_pipeline) ;;
              # Discover PR1 — portfolio foundation (docs/DISCOVER_V1_BRIEF.md).
              0071_discover_portfolio_foundation) ;;
              # Luster L1 PR1 — dark catalog foundation.
              0072_l1_catalog_foundation) ;;
              # Luster L1 PR2 — dark catalog grouping / capability / rule
              # foundation.
              0073_l1_catalog_rules_foundation) ;;
              0074_onboarding_account_site_foundation) ;;
              # Quick Book design system — onboarding cover media role.
              0075_onboarding_cover_media_role) ;;
              0076_deposit_shadow_evidence) ;;
              0077_review_requests) ;;
              # New-track Stripe customer identity (billing_customer).
              0079_billing_customer) ;;
              0080_customer_booking_operation) ;;
