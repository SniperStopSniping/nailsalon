          if ! git diff --quiet "$base" -- migrations/0097_founding_lifetime_core.sql migrations/meta/0097_snapshot.json; then
            if git cat-file -e "$base:migrations/0097_founding_lifetime_core.sql" 2>/dev/null \
              || git cat-file -e "$base:migrations/meta/0097_snapshot.json" 2>/dev/null; then
              echo "::error::Migration 0097 and its snapshot are already shipped and immutable."
